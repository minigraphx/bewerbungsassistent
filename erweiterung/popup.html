<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Bewerbungsbegleiter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1>Bewerbungsbegleiter</h1>
    <span id="verbindung" class="state" role="status">wird geprüft …</span>
  </header>
  <section id="fehlt" class="part" hidden>
    <div class="notice">
      <p class="notice__title">Die App läuft nicht</p>
      <p id="fehlt-text"></p>
    </div>
    <button id="verbinden" type="button" class="zweitrangig">Nochmals verbinden</button>
  </section>
  <section id="suche" class="part" aria-labelledby="suche-titel" hidden>
    <h2 id="suche-titel">Stellen suchen</h2>
    <p id="suche-zeile" class="line"></p>
    <div id="lauf" hidden>
      <div id="balken" class="progress" aria-hidden="true"></div>
      <ul id="portale" class="portals"></ul>
      <p id="lauf-hinweis" class="line"></p>
      <button id="abbrechen" type="button" class="zweitrangig">Suche abbrechen</button>
    </div>
    <button id="suchen" type="button" disabled>Suche starten</button>
    <ul id="hinweise" class="klein"></ul>
  </section>
  <section id="seite" class="part" aria-labelledby="seite-h" hidden>
    <h2 id="seite-h">Diese Seite</h2>
    <p id="seite-status" class="line"></p>
    <div id="seite-anzeige" hidden>
      <p id="seite-titel" class="ad__title"></p>
      <p id="seite-firma-text" class="line"></p>
      <button id="seite-korrigieren" type="button" class="link">Angaben korrigieren</button>
      <div id="seite-felder" hidden>
        <label>Stelle <input id="seite-stelle" type="text" maxlength="200"></label>
        <label>Firma <input id="seite-firma" type="text" maxlength="200"></label>
      </div>
      <div id="seite-ergebnis" class="rating" hidden>
        <div id="seite-noten"></div>
        <p id="seite-text"></p>
        <ul id="seite-zeilen" class="klein"></ul>
        <p class="rating__foot">Einschätzung der KI, kann sich irren</p>
      </div>
      <button id="seite-pruefen" type="button">Stelle prüfen</button>
      <button id="seite-speichern" type="button" class="zweitrangig">Stelle speichern</button>
    </div>
  </section>
  <footer class="foot">
    <button id="oeffnen" type="button" class="link">Treffer in der App ansehen</button>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
