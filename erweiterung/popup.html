<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Bewerbungsassistent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Bewerbungsassistent</h1>
  <p id="verbindung" class="hinweis">Verbindung zur App wird geprüft …</p>
  <button id="suchen" type="button" disabled>Suche starten</button>
  <p id="plan" class="klein">Sucht nach dem Suchprofil auf den passenden Portalen. Die Treffer gehen in die App.</p>
  <section id="lauf" hidden>
    <h2>Suche</h2>
    <p id="schritt"></p>
    <ul id="portale"></ul>
    <ul id="hinweise" class="klein"></ul>
  </section>
  <button id="oeffnen" type="button" class="zweitrangig">Treffer in der App ansehen</button>
  <script src="popup.js" type="module"></script>
</body>
</html>
