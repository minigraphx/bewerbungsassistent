<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Bewerbungsbegleiter: Erlaubnis</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="ask">
  <main class="ask__page">
    <p class="ask__brand">Bewerbungsbegleiter</p>
    <h1 id="frage">Darf die Erweiterung Bewerbungsformulare ausfüllen?</h1>
    <p id="text"></p>
    <div class="ask__boxes">
      <section class="ask__box" aria-labelledby="tut-h">
        <h2 id="tut-h">Was sie dort tut</h2>
        <ul id="tut"></ul>
      </section>
      <section class="ask__box" aria-labelledby="nie-h">
        <h2 id="nie-h">Was sie nie tut</h2>
        <ul id="nie"></ul>
      </section>
    </div>
    <p id="fuss" class="klein"></p>
    <div class="ask__actions">
      <button id="erlauben" type="button">Erlaubnis geben</button>
      <button id="ablehnen" type="button" class="link">Nicht erlauben</button>
    </div>
    <p id="meldung" role="status"></p>
  </main>
  <script src="erlauben.js" type="module"></script>
</body>
</html>
