<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Dialog</title>
<style>body{padding:16px} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start} .stack{display:grid;gap:16px} .cap{margin:0 0 4px;font-size:13px;line-height:18px;color:var(--text-muted)} .dlg-stage{position:relative;min-height:220px;padding:16px;border-radius:10px;background:rgba(22,25,29,.45)} .dlg-stage .dialog{position:static;margin:0 auto}</style>
</head>
<body>
<div class="dlg-stage">
<dialog class="dialog" open aria-labelledby="d1" aria-describedby="d1t">
  <h2 class="dialog__title" id="d1">Anschreiben ersetzen?</h2>
  <p class="dialog__text" id="d1t">Der neue Entwurf ersetzt das jetzige Anschreiben. Die jetzige Fassung bleibt unter Entwürfe erhalten.</p>
  <div class="dialog__actions"><button class="btn" type="button" autofocus>Abbrechen</button><button class="btn btn--primary" type="button">Ersetzen</button></div>
</dialog>
</div>
</body>
</html>
