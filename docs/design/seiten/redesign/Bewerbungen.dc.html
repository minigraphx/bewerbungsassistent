<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bewerbungen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
body{margin:0}
button,input,select{font:inherit}
a{color:#27333f}a:hover{color:#38495d}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 960px; background: #fdfcfa; font-family: 'DM Sans', system-ui, sans-serif; color: #38495d; font-size: 16px; line-height: 24px">
<div style="flex: 1 0 248px; background: #ffffff; border-right: 1px solid #d9dde3">
<dc-import name="Seitenleiste" active="bewerbungen" hint-size="248px,620px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; color: #27333f">Bewerbungen</h1>
<button type="button" style="min-height: 44px; padding: 0 18px; border: 1px solid #7c8794; border-radius: 6px; background: #ffffff; color: #27333f; font-weight: 500">Stelle selbst erfassen</button>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #d9dde3">
<div role="tablist" aria-label="Bewerbungen filtern" style="display: flex; flex-wrap: wrap; gap: 4px">
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #38495d">Gemerkt <span style="color: #5a6879">4</span></button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #38495d">Beworben <span style="color: #5a6879">2</span></button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #38495d">Abgeschlossen <span style="color: #5a6879">2</span></button>
<button type="button" role="tab" aria-selected="true" style="min-height: 44px; padding: 0 14px; border: 0; border-bottom: 3px solid #38495d; background: transparent; color: #27333f; font-weight: 700">Alle <span style="font-weight: 400">8</span></button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-bottom: 6px">
<label for="find" style="font-size: 15px; color: #5a6879">Suchen</label>
<input id="find" type="search" placeholder="Firma oder Stelle" style="min-height: 40px; width: 220px; box-sizing: border-box; padding: 0 12px; border: 1px solid #7c8794; border-radius: 6px; background: #ffffff; color: #27333f">
</div>
</div>

<div style="overflow-x: auto; background: #ffffff; border: 1px solid #d9dde3; border-radius: 10px">
<table style="width: 100%; min-width: 780px; border-collapse: collapse; font-size: 15px; line-height: 20px; text-align: left">
<thead>
<tr style="font-size: 14px; color: #5a6879">
<th scope="col" style="padding: 12px 16px; font-weight: 500">Stelle und Firma</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Stand</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Note</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Nächster Schritt</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Bis wann</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<tr style="border-top: 1px solid #d9dde3">
<td style="padding: 12px 16px"><label style="display: flex; align-items: flex-start; gap: 12px"><input type="checkbox" aria-label="{{r.pick}}" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #38495d"><span><a href="Bewerbung.dc.html" style="font-weight: 500; text-decoration: none">{{r.title}}</a><br><span style="color: #5a6879">{{r.firm}}</span></span></label></td>
<td style="padding: 12px 16px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; background: {{r.bg}}; color: {{r.fg}}; border: 1px {{r.line}} {{r.bd}}"><span aria-hidden="true" style="box-sizing: border-box; width: 8px; height: 8px; border-radius: 999px; background: {{r.dot}}; border: 1.5px solid {{r.fg}}"></span>{{r.status}}</span></td>
<td style="padding: 12px 16px; font-weight: 700; color: #27333f; font-variant-numeric: tabular-nums">{{r.grade}}</td>
<td style="padding: 12px 16px; color: #27333f">{{r.next}}</td>
<td style="padding: 12px 16px; font-variant-numeric: tabular-nums">{{r.due}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 15px; line-height: 22px">
<button type="button" disabled style="min-height: 40px; padding: 0 14px; border: 1px solid #d9dde3; border-radius: 6px; background: #f4f2ee; color: #5a6879; font-weight: 500">Angehakte verwerfen</button>
<span style="color: #5a6879">Zuerst Bewerbungen anhaken.</span>
<a href="#" style="margin-left: auto">Gemerkte in einem Durchgang bewerten</a>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const look = {
'Gespräch': { bg: '#e6f2e8', fg: '#2e6b3a', bd: '#2e6b3a', line: 'solid', dot: '#2e6b3a' },
'Beworben': { bg: '#e8edf3', fg: '#38495d', bd: '#e8edf3', line: 'solid', dot: '#38495d' },
'Bewerben': { bg: '#38495d', fg: '#ffffff', bd: '#38495d', line: 'solid', dot: '#ffffff' },
'Gemerkt': { bg: '#ffffff', fg: '#38495d', bd: '#7c8794', line: 'solid', dot: '#38495d' },
'Zusage': { bg: '#2e6b3a', fg: '#ffffff', bd: '#2e6b3a', line: 'solid', dot: '#ffffff' },
'Absage': { bg: '#ffffff', fg: '#5a6879', bd: '#7c8794', line: 'solid', dot: 'transparent' }
};
const row = (title, firm, status, grade, next, due) => Object.assign({ title: title, firm: firm, status: status, grade: grade, next: next, due: due, pick: title + ' anhaken' }, look[status]);
return { rows: [
row('Datenanalyst:in', 'Musterbank, Bern', 'Gespräch', '5.5', 'Termin eintragen', 'offen'),
row('Analyst:in', 'Beispiel Versicherung, Zürich', 'Beworben', '4.5', 'Antwort abwarten', 'nachfragen ab 24.11.2026'),
row('Data Engineer', 'Muster Informatik AG, Bern', 'Bewerben', '5', 'Anschreiben lesen', '30.11.2026'),
row('Netzplaner:in', 'Beispiel Energie AG, Biel', 'Gemerkt', '4.5', 'Link zum Formular eintragen', '20.11.2026'),
row('Einkäufer:in', 'Vorbild Handel AG, Thun', 'Gemerkt', '4', 'Entscheiden', '–'),
row('BI-Entwickler:in', 'Beispiel Medien, Zürich', 'Gemerkt', '4', 'Entscheiden', '–'),
row('Projektleiter:in', 'Muster Logistik, Olten', 'Zusage', '5', 'Abgeschlossen am 02.11.2026', '–'),
row('Sachbearbeiter:in', 'Beispiel Treuhand, Biel', 'Absage', '3.5', 'Abgeschlossen am 28.10.2026', '–')
] };
}
}
</script>
</body>
</html>
