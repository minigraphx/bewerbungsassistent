<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Popup der Erweiterung, vier Zustände</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bewerbungsassistent/tokens.css">
<link rel="stylesheet" href="ds/bewerbungsassistent/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1460px; height: 720px; box-sizing: border-box; padding: 32px; background: #e9ebee; font-family: var(--font-sans); display: flex; flex-direction: column; gap: 20px;">
  <p style="margin: 0; font-size: 14px; line-height: 20px; color: #3a4048;">Das Popup öffnet sich über das Symbol der Erweiterung in der Symbolleiste des Browsers. 320&nbsp;px breit, schliesst sich beim Klick daneben.</p>
  <div style="display: flex; gap: 40px; align-items: flex-start;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><figcaption style="font-size: 13px; font-weight: 500; color: #27333f;">Verbunden, keine Stelle auf der Seite</figcaption><dc-import name="Popup" zustand="verbunden" hint-size="320px,330px"></dc-import></figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><figcaption style="font-size: 13px; font-weight: 500; color: #27333f;">Suche läuft</figcaption><dc-import name="Popup" zustand="suche" hint-size="320px,440px"></dc-import></figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><figcaption style="font-size: 13px; font-weight: 500; color: #27333f;">Auf einer Stellenanzeige, geprüft</figcaption><dc-import name="Popup" zustand="stelle" hint-size="320px,520px"></dc-import></figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><figcaption style="font-size: 13px; font-weight: 500; color: #27333f;">App nicht erreichbar</figcaption><dc-import name="Popup" zustand="getrennt" hint-size="320px,260px"></dc-import></figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1460,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
