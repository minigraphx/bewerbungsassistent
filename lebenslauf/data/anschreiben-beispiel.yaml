text: |
  Aufgrund Ihrer Stellenausschreibung erhalten Sie hiermit meine Bewerbung als Data Engineer. Daten verständlich
  aufzubereiten und zuverlässig weiterzugeben, beschäftigt mich seit vielen Jahren.

  Die Fähigkeiten, die Sie suchen, decken sich in vielen Punkten mit meinen Kenntnissen. Seit zehn Jahren entwickle
  ich Webanwendungen und Datenpipelines in Python und TypeScript, mit Tests und automatisierten Abläufen.

  Bei der Beispiel GmbH habe ich eine Plattform für Kundendaten aufgebaut und Datenpipelines mit Airflow betrieben.
  Mein Wissen gebe ich gern in internen Schulungen weiter.

  Über ein persönliches Gespräch freue ich mich sehr.
