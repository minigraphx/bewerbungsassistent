<head>

<title>Meine Angaben – Bewerbungsbegleiter</title>
<style>@font-face { font-family: "DM Sans"; src: url("/fonts/DMSans-400.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "DM Sans"; src: url("/fonts/DMSans-400i.ttf") format("truetype"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "DM Sans"; src: url("/fonts/DMSans-500.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "DM Sans"; src: url("/fonts/DMSans-700.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
/* Values from the design system (docs/design/system/tokens.json, MIN-369), the same as bewerbungen/seiten/stil.css.
   The shared file has no fonts of its own: DM Sans only where the app serves it (build_template.APP_FONTS). */
:root {
  --bg: #fdfcfa;
  --surface: #ffffff;
  --surface-subtle: #f4f2ee;
  --text-strong: #27333f;
  --text: #38495d;
  --muted: #5a6879;
  --line: #d9dde3;
  --line-strong: #7c8794;
  --accent: #38495d;
  --accent-hover: #27333f;
  --accent-text: #ffffff;
  --accent-soft: #e8edf3;
  --focus: #38495d;
  --danger: #b3261e;
  --danger-soft: #fde7e5;
  --success: #2e6b3a;
  --success-soft: #e6f2e8;
  --radius: 10px;
  --radius-control: 6px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16191d;
    --surface: #1f2328;
    --surface-subtle: #1a1e22;
    --text-strong: #f0f3f6;
    --text: #e3e7ec;
    --muted: #a3adb9;
    --line: #3a4048;
    --line-strong: #7d8794;
    --accent: #c9d4e2;
    --accent-hover: #dfe6ef;
    --accent-text: #16191d;
    --accent-soft: #273241;
    --focus: #c9d4e2;
    --danger: #ff8a80;
    --danger-soft: #3d1f1d;
    --success: #8fd19e;
    --success-soft: #1d3322;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/24px "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, legend { color: var(--text-strong); }
h1 { font-size: 24px; line-height: 30px; margin: 0 0 20px; }
h2 { font-size: 22px; line-height: 28px; margin: 0 0 8px; }
h3 { font-size: 18px; line-height: 24px; margin: 0 0 4px; }
.top { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.top .privacy { margin: 4px 0 0; font-size: 14px; line-height: 20px; }
.brand { margin: 0; color: var(--text-strong); font-weight: 700; }
/* Page: steps on the left, the current step on the right (design: Angaben) */
.layout {
  display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px 48px; align-items: start;
  max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px;
}
.layout > * { min-width: 0; }
.side { position: sticky; top: 16px; }
.autosave { margin: 16px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
.autosave:empty { display: none; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 9px; top: 26px; bottom: -6px; width: 2px; background: var(--line); }
.step__button {
  display: grid; grid-template-columns: 20px 1fr; column-gap: 12px; width: 100%; padding: 4px 0 14px; border: 0;
  background: none; color: var(--text-strong); text-align: left; font: inherit;
}
.step__dot { grid-row: 1 / span 3; width: 20px; height: 20px; margin-top: 2px; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface); }
.step[data-state="current"] .step__dot { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--surface); background: var(--accent); }
.step[data-state="done"] .step__dot { border-color: var(--accent); background: var(--accent); }
.step__label { font-size: 15px; line-height: 24px; }
.step[data-state="current"] .step__label { font-weight: 700; }
.step__button:hover .step__label { text-decoration: underline; text-underline-offset: 3px; }
.step__meta { font-size: 13px; line-height: 18px; color: var(--muted); }
.step__mark { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--danger); }
.step[data-mark="suggested"] .step__mark { color: var(--text-strong); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; }
.card + .card { margin-top: 24px; }
.choice-card__line { margin: 0 0 4px; color: var(--text-strong); }
.choice-card__line a { margin-left: 16px; font-weight: 500; }
.choice-card .hint { margin: 0; }
.choice-card .suggestion { margin: 12px 0 0; }
.privacy, .intro, .hint, .secondary, footer { color: var(--muted); }
.hint { font-size: 14px; line-height: 20px; margin: 0 0 4px; }
a { color: var(--text-strong); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
#main { outline: none; }
#main > section:not(.start--app) {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px;
}
.group > .hint { margin-bottom: 16px; }
.part + .part { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
.field { margin: 16px 0; }
label, legend { display: block; font-weight: 500; font-size: 14px; line-height: 20px; margin-bottom: 4px; color: var(--text-strong); }
input[type="text"], input[type="email"], input[type="tel"], textarea, select {
  width: 100%; min-height: 40px; padding: 8px 12px; font: inherit; color: var(--text-strong); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--radius-control);
}
textarea { resize: vertical; }
:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
.invalid input, .invalid textarea, .invalid select { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.error { color: var(--danger); font-size: 14px; line-height: 20px; font-weight: 500; margin: 4px 0 0; min-height: 0; }
.error:empty { display: none; }
fieldset { border: 0; padding: 0; margin: 0; }
.choice .option { display: flex; align-items: baseline; gap: 8px; font-weight: 400; font-size: 16px; line-height: 24px; color: var(--text); margin: 6px 0; }
.choice .option input { accent-color: var(--accent); }
.choice .own-option { flex-wrap: wrap; }
.canton-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0 16px; }
.field.wanted { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
.wanted-note { margin: 0 0 8px; font-weight: 500; color: var(--text-strong); }
.choice .own { flex: 1 1 14rem; }
.item {
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 16px 16px; margin: 16px 0;
}
.item legend { padding: 0 4px; font-size: 16px; font-weight: 700; }
button { font: inherit; cursor: pointer; }
.nav-buttons { display: flex; justify-content: space-between; gap: 16px; margin-top: 32px; }
.nav-buttons button, .add, .remove, .primary, .confirm button {
  min-height: 40px; padding: 0 16px; border-radius: var(--radius-control); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text-strong); font-weight: 500;
}
.nav-buttons button:hover, .add:hover, .remove:hover, .confirm button:hover { background: var(--surface-subtle); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.nav-buttons .primary { margin-left: auto; background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.nav-buttons .primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.remove { font-size: 14px; color: var(--danger); }
.add { border-style: dashed; width: 100%; }
.tagged-line { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.tagged-line input { min-width: 0; flex: 3 1 16rem; }
.tagged-line input.line-tags { flex: 1 1 8rem; }
.tagged-line .bilingual { flex: 1 0 100%; }
.tagged-line .remove-line { min-width: 40px; min-height: 40px; border: 1px solid var(--line-strong); border-radius: var(--radius-control);
  background: var(--surface); color: var(--danger); flex: 0 0 auto; }
.add-line { min-height: 32px; padding: 0 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius-control);
  background: var(--surface); color: var(--text-strong); font-size: 14px; }
.danger { color: var(--danger); border-color: var(--danger); }
.link { border: 0; background: none; padding: 0; color: var(--text-strong); text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 16px; margin: 20px 0; }
.track {
  display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 16px 20px;
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text);
}
.track strong { font-size: 17px; color: var(--text-strong); }
.track span { color: var(--muted); font-size: 14px; line-height: 20px; }
.track:hover, .track.selected { border-color: var(--accent); background: var(--accent-soft); }
.summary ul { padding-left: 20px; }
.files { list-style: none; padding: 0; margin: 8px 0; }
.files li { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.file-name { flex: 1 1 auto; overflow-wrap: anywhere; }
.file-size { color: var(--muted); font-size: 14px; white-space: nowrap; }
.files .remove { min-height: 32px; padding: 0 12px; }
.upload-category .add { margin-top: 6px; }
.upload-category .add:disabled { opacity: 0.5; cursor: not-allowed; }
.upload-category .limit-note { margin: 4px 0 0; }
.ok { background: var(--success-soft); color: var(--text-strong); padding: 12px 16px; border-radius: var(--radius-control); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#replace { margin-left: 8px; }
.suggestion { background: var(--accent-soft); color: var(--text-strong); padding: 8px 12px; border-radius: var(--radius-control); font-size: 14px; line-height: 20px; margin: 0 0 10px; }
/* Start in the app: documents and „Vorbefüllen“ in one card */
.prefill-card h2 { font-size: 18px; line-height: 24px; }
.start--app > p { margin: 16px 0 0; }
.prefill-card .upload-category .hint { font-size: 13px; line-height: 18px; }
.prefill-card__files { margin: 8px 0 0; }
.prefill-card .upload-category { border: 0; border-top: 1px solid var(--line); border-radius: 0; margin: 0; padding: 12px 0; }
.prefill-card .upload-category legend { float: left; width: 100%; padding: 0; margin: 0 0 2px; font-size: 15px; }
.prefill-card .upload-category .hint { clear: both; }
.prefill-card .upload-category .add { width: auto; min-height: 32px; border-style: solid; font-size: 14px; }
.prefill-card__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 16px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.prefill-card__actions .link { font-weight: 500; }
.prefill-card #prefill:disabled:not(.busy), #take-over:disabled { opacity: 0.5; cursor: not-allowed; }
.prefill-card #prefill.busy { cursor: progress; }
.prefill-card__status { margin: 0 0 12px; font-weight: 500; }
/* Take over: one line per step */
.review { list-style: none; margin: 16px 0 24px; padding: 0; border-top: 1px solid var(--line); }
.review__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.review__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.review__state { color: var(--success); font-size: 14px; }
.review__state--empty { color: var(--muted); }
.review__missing { margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 20px; }
.review__missing .link { color: var(--danger); }
.review__open { flex: none; min-height: 32px; padding: 0 12px; border-radius: var(--radius-control); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-strong); font-weight: 500; }
.review__open:hover { background: var(--surface-subtle); }
.not-taken-over { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--danger); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; gap: 16px; padding: 16px 16px 48px; }
  .side { position: static; }
  h1 { margin-bottom: 12px; }
  .steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .step:not(:last-child)::before { display: none; }
  .step__button { display: block; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-control); white-space: nowrap; }
  .step__dot, .step__meta, .step__mark { display: none; }
  .step[data-state="current"] .step__button { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .step[data-mark="flagged"]:not([data-state="current"]) .step__label::after { content: " •"; color: var(--danger); }
  .step__label { font-size: 14px; line-height: 20px; }
  #main > section:not(.start--app), .card { padding: 16px; }
}

/* Choice per existing Markdown file before taking over (G26) */
.replace-choice { margin: 16px 0; }
.replace-choice__file { margin: 12px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); }
.replace-choice .choice { display: flex; flex-wrap: wrap; gap: 0 24px; }
.diff__lines { margin: 8px 0 0; padding: 8px 0; max-height: 360px; overflow: auto; font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-subtle); border-radius: var(--radius-control); }
.diff__line { display: block; padding: 0 8px; }
.diff__line ins, .diff__line del { text-decoration: none; }
.diff__line--weg { background: var(--danger-soft); }
.diff__line--neu { background: var(--success-soft); }
.diff__line--gap { color: var(--muted); }
/* Only in the page „Meine Angaben“ of the app: the navigation of the app, as in bewerbungen/seiten/stil.css
   (the page brings its own styles by hash and loads no stylesheet). Keep the two in step. */
.app-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.app-nav__brand { margin-right: auto; padding: 8px 4px; font-weight: 700; color: var(--text-strong); text-decoration: none; }
.app-nav__list { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.app-nav__link, .app-nav__more > summary { display: block; padding: 6px 12px; border-radius: var(--radius-control); color: var(--text-strong); font-weight: 500; text-decoration: none; cursor: pointer; }
.app-nav__link:hover, .app-nav__more > summary:hover { background: var(--surface-subtle); color: var(--text-strong); }
.app-nav__link[aria-current="page"], .app-nav__more:has(a[aria-current="page"]) > summary { background: var(--accent); color: var(--accent-text); }
.app-nav__more { position: relative; }
.app-nav__more > summary { list-style: none; }
.app-nav__more > summary::-webkit-details-marker { display: none; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 240px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); }
.menu__group:empty { display: none; }
.menu__group + .menu__group { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.menu__heading { margin: 0; padding: 4px 8px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); }
.menu a, .menu button { display: block; width: 100%; padding: 6px 8px; border: 0; border-radius: 4px; background: none; color: var(--text-strong); font: inherit; text-align: left; text-decoration: none; cursor: pointer; }
.menu a:hover, .menu button:hover { background: var(--surface-subtle); }
.menu__meta { margin: 0; padding: 4px 8px; font-size: 13px; color: var(--muted); }
.menu__about { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 8px; }
.menu__about .menu__heading, .menu__about .menu__meta { padding: 0; line-height: 18px; }
.menu__logo { flex: none; width: 28px; height: 28px; }
/* Messages of app.js (new version, backup) above the page */
.banner, .status { grid-column: 1 / -1; margin: 0; padding: 12px 16px; border-radius: var(--radius-control); background: var(--accent-soft); color: var(--text-strong); }
.banner button, .banner a, .status button { margin-left: 8px; }
.status.fehler { background: var(--danger-soft); }
.status.ok { background: var(--success-soft); }
/* Dialog of app.js for a new version (#32), as .dialog and .btn in bewerbungen/seiten/stil.css */
.dialog { width: min(520px, calc(100% - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); }
.dialog::backdrop { background: rgba(22, 25, 29, 0.45); }
.dialog__title { margin: 0 0 8px; font-size: 18px; line-height: 24px; font-weight: 700; color: var(--text-strong); }
.dialog__text { margin: 0 0 24px; }
.dialog__actions { display: flex; flex-wrap: wrap-reverse; gap: 8px; justify-content: flex-end; }
.dialog .btn { display: inline-block; padding: 8px 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--text-strong); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; }
.dialog .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.dialog .btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
</style>
</head>

<nav class="app-nav" aria-label="Hauptnavigation"><a class="app-nav__brand" href="/">Bewerbungsbegleiter</a><ul class="app-nav__list"><li><a class="app-nav__link" href="/">Übersicht</a></li><li><a class="app-nav__link" href="/treffer" data-text="nav.suche">Stellen suchen</a></li><li><a class="app-nav__link" href="/angaben">Meine Angaben</a></li></ul><details class="app-nav__more"><summary>Mehr</summary><div class="menu"><div class="menu__group"><p class="menu__heading">Suche</p><a href="/firmen" data-text="nav.firmen">Firmen</a></div><div class="menu__group"><p class="menu__heading">Unterlagen</p><a href="/dateien">Meine Dateien</a><a href="/entwuerfe">Entwürfe und Versionen</a><a href="/foto">Foto</a></div><div class="menu__group"><p class="menu__heading">Hilfe</p><a href="/fragen">Fragen an die KI</a><a href="/einrichtung">Einrichtung</a></div><div class="menu__group"><p class="menu__heading">Für Geübte</p><a href="/inhalte">Inhalte als Text</a><a href="/einstellungen">Erweiterte Einstellungen</a></div><div class="menu__group" id="menu-app"></div></div></details></nav>
<main class="layout">

nslauf. Freiwillige Felder kannst du leer lassen. Bevor ein Text zur KI geht, ersetzt die App deinen Namen, Strasse, PLZ, Telefon, E-Mail, Geburtsdatum und deine Schulen durch Platzhalter. Betriebe und Jahreszahlen bleiben stehen, damit die KI deinen Werdegang versteht. Ersetzen kann die App nur, was hier richtig eingetragen ist."}, "fields": [{"id": "name", "label": "Vor- und Nachname", "type": "text", "required": true, "max": 80, "hint": {"job": "Schreiben Sie den Namen genau wie im Lebenslauf, mit denselben Akzenten und Umlauten. In dieser Schreibweise ersetzt die App den Namen, bevor ein Text zur KI geht.", "apprenticeship": "Schreib deinen Namen genau wie im Lebenslauf, mit denselben Akzenten und Umlauten. In dieser Schreibweise ersetzt die App den Namen, bevor ein Text zur KI geht."}}, {"id": "label", "label": "Berufsbezeichnung unter dem Namen (freiwillig)", "type": "text", "max": 100, "tracks": ["job"], "placeholder": "z.B. Kaufmann EFZ – Buchhaltung und Administration"}, {"id": "address", "label": "Strasse und Nummer", "type": "text", "max": 100}, {"id": "postalCode", "label": "PLZ", "type": "text", "format": "postalCode"}, {"id": "city", "label": "Ort", "type": "text", "required": true, "max": 60}, {"id": "phone", "label": "Telefon", "type": "text", "format": "phone"}, {"id": "email", "label": "E-Mail", "type": "text", "required": true, "format": "email", "hint": {"apprenticeship": "Die Adresse soll seriös wirken, z.B. vorname.nachname@…"}}, {"id": "birthDate", "label": "Geburtsdatum (freiwillig)", "type": "text", "max": 30, "hint": {"apprenticeship": "Bei Lehrstellen ist das Geburtsdatum üblich."}}, {"id": "nationality", "label": "Nationalität (freiwillig)", "type": "text", "max": 60}, {"id": "url", "label": "Eigene Webseite (freiwillig)", "type": "text", "format": "url", "tracks": ["job"], "keepUnlessGiven": true}, {"id": "profiles", "label": "Profil-Links, z.B. LinkedIn (freiwillig, ein Link pro Zeile)", "type": "list", "format": "url", "maxItems": 5, " ro Zeile)", "type": "list", "maxItems": 8, "max": 60}]}, {"id": "searchJob", "title": "Suche", "tracks": ["job"], "intro": {"job": "Danach sucht die App Stellen für Sie."}, "fields": [{"id": "directions", "label": "Gesuchte Stellen oder Tätigkeiten (eine pro Zeile, die wichtigste zuerst)", "type": "list", "hint": "Sie wissen noch nicht genau, was infrage kommt? Lassen Sie das Feld leer. In der App schlägt Ihnen danach die KI unter „Suche“ Stellen vor, die zu Ihren Interessen und Fähigkeiten passen.", "maxItems": 5}, {"id": "exclusions", "label": "Was auf keinen Fall? (freiwillig, eins pro Zeile)", "type": "list", "maxItems": 10}, {"id": "home", "label": "Wohnort für die Suche", "type": "text", "required": true, "max": 60}, {"id": "commute", "label": "Längster Arbeitsweg (z.B. 45 Minuten mit ÖV)", "type": "text", "max": 100}, {"id": "cantons", "label": "Kantone (freiwillig)", "type": "list", "format": "canton", "maxItems": 26, "control": "cantons", "hint": "Ohne Auswahl sucht die App in der ganzen Schweiz; Stellen nahe Ihrem Wohnort stehen dann zuerst."}, {"id": "remote", "label": "Homeoffice erwünscht?", "type": "select", "options": ["ja", "teilweise", "nein"]}, {"id": "workload", "label": "Pensum (z.B. 80–100 %)", "type": "text", "required": true, "max": 40}, {"id": "start", "label": "Frühester Start (z.B. 1. März)", "type": "text", "required": true, "max": 40}, {"id": "temporary", "label": "Befristete Stelle möglich?", "type": "select", "options": ["ja", "nein"]}, {"id": "keywords", "label": "Stichworte für die Suche (freiwillig, eins pro Zeile)", "type": "list", "maxItems": 15, "max": 60}, {"id": "titleExclude", "label": "Titel, die nicht passen (freiwillig, z.B. Praktikum)", "type": "list", "maxItems": 15, "max": 60}, {"id": "targetCompanies", "label": "Wunschfirmen (freiwillig, eine pro Zeile)", "type": "list", "maxItems": 15, "max": 100}]}, {"id": "searchApprenticeship", "title": "Lehrstellensuche", "tracks": ["apprenticeship"], "intro": {"apprenticeship": "We
