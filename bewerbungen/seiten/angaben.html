<style>:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --text: #1f2421;
  --muted: #5b625e;
  --line: #d9d6cd;
  --accent: #1d6b5f;
  --accent-text: #ffffff;
  --accent-soft: #e3f0ec;
  --danger: #a3271f;
  --danger-soft: #fbeceb;
  --radius: 10px;

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171a19;
    --surface: #212624;
    --text: #e8ebe9;
    --muted: #a3aba7;
    --line: #3a413e;
    --accent: #5fbfae;
    --accent-text: #0e1513;
    --accent-soft: #23342f;
    --danger: #f08a80;

* { box-sizing: border-box; }
body {
  margin: 0 auto;
  max-width: 46rem;
  padding: 1.5rem 1rem 4rem;

  color: var(--text);

}
h1 { font-size: 1.9rem; margin: 0.1rem 0 0.4rem; }
h2 { font-size: 1.4rem; margin: 0 0 0.5rem; }
.brand { margin: 0; color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
.privacy, .intro, .hint, .secondary, footer { color: var(--muted); }
.hint { font-size: 0.92rem; margin: 0 0 0.3rem; }
nav ol { list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0; margin: 1.2rem 0; }
.step {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.88rem; cursor: pointer;
}
.step.current { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.step.flagged:not(.current)::after { content: " •"; color: var(--danger); }
main {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.5rem; outline: none;
}
.field { margin: 1.1rem 0; }
label, legend { display: block; font-weight: 600; margin-bottom: 0.25rem; }
input[type="text"], input[type="email"], input[type="tel"], textarea, select {
  width: 100%; padding: 0.6rem 0.7rem; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
}
textarea { resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {

}
.invalid input, .invalid textarea, .invalid select { border-color: var(--danger); background: var(--danger-soft); }
.error { color: var(--danger); font-size: 0.92rem; margin: 0.25rem 0 0; min-height: 0; }
.error:empty { display: none; }
fieldset { border: 0; padding: 0; margin: 0; }
.choice .option { display: flex; align-items: baseline; gap: 0.5rem; font-weight: 400; margin: 0.35rem 0; }
.choice .own-option { flex-wrap: wrap; }
.canton-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0 1rem; }
.not-taken-over { margin: 0.75rem 0 0; font-size: 0.9rem; color: var(--danger); }
.field.wanted { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
.wanted-note { margin: 0 0 0.5rem; font-weight: 600; }
.choice .own { flex: 1 1 14rem; }
.item {
  border: 1px solid var(--line); border-radius: var(--radius); padding: 0.4rem 1rem 1rem; margin: 1rem 0;
}
.item legend { padding: 0 0.3rem; font-size: 1.05rem; }
button { font: inherit; cursor: pointer; }
.nav-buttons { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; }
.nav-buttons button, .add, .remove, .primary, .confirm button {
  padding: 0.55rem 1.1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.nav-buttons .primary { margin-left: auto; }
.remove { font-size: 0.9rem; color: var(--danger); }
.add { border-style: dashed; width: 100%; }
.danger { color: var(--danger); border-color: var(--danger); }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-align: left; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; margin: 1.2rem 0; }
.track {
  display: flex; flex-direction: column; gap: 0.3rem; text-align: left; padding: 1.1rem;
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--text);
}
.track strong { font-size: 1.1rem; }
.track span { color: var(--muted); font-size: 0.95rem; }
.track:hover, .track.selected { border-color: var(--accent); background: var(--accent-soft); }
.summary ul { padding-left: 1.1rem; }
.files { list-style: none; padding: 0; margin: 0.5rem 0; }
.files li { display: flex; align-items: center; gap: 0.75rem; padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
.file-name { flex: 1 1 auto; overflow-wrap: anywhere; }
.file-size { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.files .remove { padding: 0.25rem 0.6rem; }
.upload-category .add { margin-top: 0.4rem; }
.ok { background: var(--accent-soft); padding: 0.75rem 1rem; border-radius: 8px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
footer { font-size: 0.88rem; margin-top: 1rem; }
@media (max-width: 30rem) {
  body { padding: 1rem 0.75rem 3rem; }
  main { padding: 1rem; }
}
.back { display: inline-block; margin-bottom: 8px; }
#replace { margin-left: 8px; }
.suggestion { background: var(--accent-soft); padding: 0.5rem 0.75rem; border-radius: 8px; font-size: 0.92rem; margin: 0 0 0.6rem; }
.step.suggested::after { content: " •"; color: var(--accent); }
.prefill { margin: 1.2rem 0; }
.prefill button:disabled, #take-over:disabled { opacity: 0.6; cursor: not-allowed; }
</style>

<script>// Validation of onboarding bundles against form.json, for the browser.
// Mirrors validation.py; both run the shared cases in tests/cases.json.
"use strict";

const SINGLE_LINE = new Set(["text", "list", "select", "choice"]);
const TOP_LEVEL_KEYS = new Set(["format", "version", "track", "data", "saved"]);

const MESSAGES = {
  required: "Bitte ausfüllen.",
  type: "Unerwarteter Wert, bitte neu eingeben.",
  max: "Zu lang (höchstens {max} Zeichen).",
  maxItems: "Zu viele Einträge (höchstens {maxItems}).",
  format: "Ungültiges Format, zum Beispiel: {example}.",
  option: "Bitte einen der vorgeschlagenen Werte wählen.",
  notBefore: "Liegt vor dem Beginn.",
  newline: "Bitte ohne Zeilenumbruch.",
  unknown: "Gehört nicht zu dieser Vorlage.",
  bundle: "Die Datei ist keine Einstiegsdatei dieser Version.",
  track: "Unbekannte Art der Suche.",
};

const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const err = (path, code) => ({ path, code });

function applies(item, track) {
  return !item.tracks || item.tracks.includes(track);
}

/** True if track names a track of the form (a string key, not inherited). */
function isTrack(form, track) {
  return typeof track === "string" && Object.prototype.hasOwnProperty.call(form.tracks, track);
}

function forTrack(value, track) {
  return isObject(value) ? value[track] : value;
}

function textLimit(form, field) {
  return field.max ?? form.limits[field.type === "textarea" ? "textarea" : "text"];
}

function validateBundle(form, bundle) {
  if (!isObject(bundle)) return [err("", "type")];
  if (bundle.format !== form.format) return [err("format", "bundle")];
  if (bundle.version !== form.version) return [err("version", "bundle")];
  const track = bundle.track;
  if (!isTrack(form, track)) return [err("track", "track")];
  const data = bundle.data;
  if (!isObject(data)) return [err("data", "type")];
  const errors = Object.keys(bundle).filter((k) => !TOP_LEVEL_KEYS.has(k)).map((k) => err(k, "unknown"));
  const sections = form.sections.filter((s) => applies(s, track));
  const ids = new Set(sections.map((s) => s.id));
  errors.push(...Object.keys(data).filter((k) => !ids.has(k)).map((k) => err(k, "unknown")));
  for (const section of sections) errors.push(...validateSection(form, section, track, data[section.id]));
  return errors;
}

function validateSection(form, section, track, value) {
  const sid = section.id;
  if (!section.repeat) {
    const item = value ?? {};
    return isObject(item) ? validateItem(form, section, track, item, sid) : [err(sid, "type")];
  }
  if (value == null) return [];
  if (!Array.isArray(value)) return [err(sid, "type")];
  const errors = [];
  if (value.length > (section.maxItems ?? form.limits.repeatItems)) errors.push(err(sid, "maxItems"));
  value.forEach((item, index) => {
    const path = `${sid}.${index}`;
    if (!isObject(item)) errors.push(err(path, "type"));
    else errors.push(...validateItem(form, section, track, item, path));
  });
  return errors;
}

function validateItem(form, section, track, item, path) {
  const fields = section.fields.filter((f) => applies(f, track));
  const ids = new Set(fields.map((f) => f.id));
  const errors = Object.keys(item).filter((k) => !ids.has(k)).map((k) => err(`${path}.${k}`, "unknown"));
  for (const field of fields) errors.push(...validateField(form, field, track, item, `${path}.${field.id}`));
  return errors;
}

function validateField(form, field, track, item, path) {
  const value = item[field.id];
  if (field.type === "list") return validateList(form, field, value, path);
  const text = value ?? "";
  if (typeof text !== "string") return [err(path, "type")];
  if (!text.trim()) return field.required ? [err(path, "required")] : [];
  const code = checkText(form, field, track, text);
  if (code) return [err(path, code)];
  if (field.notBefore && isBefore(text, item[field.notBefore])) return [err(path, "notBefore")];
  return [];
}

function validateList(form, field, value, path) {
  const list = value ?? [];
  if (!Array.isArray(list) || !list.every((v) => typeof v === "string")) return [err(path, "type")];
  const items = list.filter((v) => v.trim());
  if (!items.length) return field.required ? [err(path, "required")] : [];
  const errors = [];
  if (items.length > (field.maxItems ?? form.limits.listItems)) errors.push(err(path, "maxItems"));
  list.forEach((entry, index) => {
    if (!entry.trim()) return;
    const code = checkText(form, field, null, entry);
    if (code) errors.push(err(`${path}.${index}`, code));
  });
  return errors;
}

function checkText(form, field, track, value) {
  if (SINGLE_LINE.has(field.type) && /[\r\n]/.test(value)) return "newline";
  // Count code points like Python's len(), not UTF-16 units.
  if (Array.from(value).length > textLimit(form, field)) return "max";
  if (field.format && !new RegExp(form.formats[field.format].pattern).test(value.trim())) return "format";
  if (field.type === "select" && !field.options.includes(value)) return "option";
  if (field.type === "choice" && !field.allowOwn && !forTrack(field.options, track).includes(value)) return "option";

}

function isBefore(end, start) {
  if (typeof start !== "string" || !start.trim()) return false;
  const e = end.trim();
  const s = start.trim();
  if (e.length === 4 || s.length === 4) return e.slice(0, 4) < s.slice(0, 4);
  return e < s;
}

function locate(form, track, path) {
  const parts = path ? path.split(".") : [];
  const section = form.sections.find((s) => parts.length && s.id === parts[0]);
  if (!section) return { where: "", field: null, section: null };
  const names = [forTrack(section.title, track) || section.id];
  let rest = parts.slice(1);
  if (section.repeat && rest.length && /^\d+$/.test(rest[0])) {
    names.push(`${forTrack(section.itemTitle, track)} ${Number(rest[0]) + 1}`);
    rest = rest.slice(1);
  }
  const field = section.fields.find((f) => rest.length && f.id === rest[0]) || null;
  if (field) {
    names.push((forTrack(field.label, track) || field.id).split(" (")[0]);
    if (rest.length > 1 && /^\d+$/.test(rest[1])) names.push(`Zeile ${Number(rest[1]) + 1}`);
  }
  return { where: names.join(", "), field, section };
}

/** Message without location, for display next to the field. */
function messageText(form, track, error) {
  return describeParts(form, track, error).text;
}

/** Message with location (section, item, field), for summaries. */
function describe(form, track, error) {
  const { where, text } = describeParts(form, track, error);
  return where ? `${where}: ${text}` : text;
}

function describeParts(form, track, error) {
  const { where, field, section } = locate(form, track, error.path);
  const params = { max: "?", maxItems: "?", example: "?" };
  if (field) {
    params.max = textLimit(form, field);
    params.maxItems = field.maxItems ?? form.limits.listItems;
    if (field.format) params.example = form.formats[field.format].example;
  } else if (section) {
    params.maxItems = section.maxItems ?? form.limits.repeatItems;
  }
  const text = (MESSAGES[error.code] || error.code).replace(/\{(\w+)\}/g, (_, k) => params[k]);
  return { where, text };
}

if (typeof module !== "undefined") {
  module.exports = { validateBundle, describe, messageText, applies, forTrack, isTrack };
}

// Pure state handling of the onboarding template: no DOM, no storage.
// State: { track: "job" | "apprenticeship" | null, data: { [sectionId]: object | object[] } }.
// List fields hold arrays of lines; blank lines and empty items are dropped only when collecting.
"use strict";

/** A loaded file that is no bundle of this form; the message is German and shown as is. */
class BundleError extends Error {}

const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

function trackApplies(item, track) {
  return !item.tracks || item.tracks.includes(track);
}

/** Sections shown for a track, in form order. */
function sectionsFor(form, track) {
  return form.sections.filter((s) => trackApplies(s, track));
}

/** Fields of a section shown for a track. */
function fieldsFor(section, track) {
  return section.fields.filter((f) => trackApplies(f, track));
}

function linesToList(text) {
  return String(text).split(/\r?\n/);
}

function listToLines(list) {
  return Array.isArray(list) ? list.join("\n") : "";
}

/** Copy of an item with only known fields of the right type. */
function cleanItem(section, track, item, compact) {
  const result = {};
  if (!isPlainObject(item)) return result;
  for (const field of fieldsFor(section, track)) {
    const value = item[field.id];
    if (field.type === "list") {
      if (!Array.isArray(value)) continue;
      const lines = value.filter((v) => typeof v === "string").map((v) => (compact ? v.trim() : v));
      const kept = compact ? lines.filter((v) => v) : lines;
      if (kept.length) result[field.id] = kept;
    } else if (typeof value === "string" && (!compact || value.trim())) {
      result[field.id] = compact ? value.trim() : value;
    }
  }
  return result;
}

function cleanData(form, track, data, compact) {
  const result = {};
  for (const section of sectionsFor(form, track)) {
    const value = isPlainObject(data) ? data[section.id] : undefined;
    if (section.repeat) {
      if (!Array.isArray(value)) continue;
      const list = value.map((item) => cleanItem(section, track, item, compact));
      const kept = compact ? list.filter((item) => Object.keys(item).length) : list;
      if (kept.length) result[section.id] = kept;
    } else if (isPlainObject(value)) {
      const item = cleanItem(section, track, value, compact);
      if (Object.keys(item).length) result[section.id] = item;
    }
  }
  return result;
}

/** The bundle written to einstieg.json: current track only, trimmed, without empty values. */
function collectBundle(form, state, now) {
  return {
    format: form.format,
    version: form.version,
    track: state.track,
    saved: now.toISOString(),
    data: cleanData(form, state.track, state.data, true),
  };
}

/** Bundle for live checks while typing: keeps item positions so error paths match the form. */
function draftBundle(form, state) {
  return { format: form.format, version: form.version, track: state.track, data: cleanData(form, state.track, state.data, false) };
}

/** True if a repeated item has no content yet (such items are dropped when saving). */
function isBlankItem(item) {
  if (!isPlainObject(item)) return true;
  return Object.values(item).every((v) => (Array.isArray(v) ? v.every((x) => !String(x).trim()) : !String(v ?? "").trim()));

/** State from a loaded file; throws an Error with a German message if it is no bundle of this form. */
function stateFromBundle(form, bundle) {
  const ok = isPlainObject(bundle) && bundle.format === form.format && bundle.version === form.version
    && typeof bundle.track === "string" && Object.prototype.hasOwnProperty.call(form.tracks, bundle.track);
  if (!ok) throw new BundleError("Die Datei ist keine Einstiegsdatei dieser Vorlage.");
  return { track: bundle.track, data: cleanData(form, bundle.track, bundle.data, false) };

/** New state with the value at path (e.g. ["work", 0, "position"]) replaced; creates missing containers. */
function setValue(state, path, value) {
  const update = (container, keys) => {
    const [key, ...rest] = keys;
    const base = container ?? (typeof key === "number" ? [] : {});
    const copy = Array.isArray(base) ? [...base] : { ...base };
    copy[key] = rest.length ? update(base[key], rest) : value;
    return copy;

  return { ...state, data: update(state.data, path) };

function addItem(state, sectionId) {
  const list = Array.isArray(state.data[sectionId]) ? state.data[sectionId] : [];
  return { ...state, data: { ...state.data, [sectionId]: [...list, {}] } };

function removeItem(state, sectionId, index) {
  const list = state.data[sectionId] || [];
  const next = { ...state, data: { ...state.data, [sectionId]: list.filter((_, i) => i !== index) } };
  return state.suggested ? { ...next, suggested: shiftSuggestions(state.suggested, sectionId, index) } : next;

// Suggestions from documents (page of the app): state.suggested = { "work.0": { file, place }, "style": { file, place } }.
// A mark says „not checked yet“. It stays while the person edits, because changing one value says nothing about

function confirmSuggestions(state, keys) {

/** Marks that count now; those of sections in the other track stay, in case the person switches back. */

  return Object.keys(state.suggested || {}).filter((key) => shown.has(key.split(".")[0]));

function shiftSuggestions(marks, sectionId, removed) {
  const shifted = {};
  for (const [key, source] of Object.entries(marks)) {
    const [section, position] = key.split(".");
    const index = Number(position);
    if (section !== sectionId || position === undefined) shifted[key] = source;
    else if (index !== removed) shifted[`${section}.${index > removed ? index - 1 : index}`] = source;

const isBlankValue = (value) => (Array.isArray(value) ? value.every((v) => !String(v).trim()) : !String(value ?? "").trim());

/** Marks kept in a stored state; it comes from a file, so only what has the expected shape stays. */
function cleanSuggestions(marks) {
  if (!isPlainObject(marks)) return {};
  const valid = ([, s]) => isPlainObject(s) && typeof s.file === "string" && typeof s.place === "string";
  return Object.fromEntries(Object.entries(marks).filter(valid).map(([key, s]) => [key, { file: s.file, place: s.place }]));

  const current = Array.isArray(data[section.id]) ? data[section.id] : [];
  if (!current.every(isBlankItem)) return null;
  const kept = Object.entries(marks).filter(([key]) => !key.startsWith(`${section.id}.`));

  return { data: { ...data, [section.id]: found.map((entry) => entry.values) }, marks: Object.fromEntries([...kept, ...added]) };

function suggestSingle(data, marks, section, found) {
  const current = isPlainObject(data[section.id]) ? data[section.id] : {};
  const free = Object.entries(found.values).filter(([key]) => isBlankValue(current[key]));

/**

function applySuggestions(form, state, suggestions) {
  let result = { data: state.data, marks: state.suggested || {} };
  const filled = [];
  const kept = [];
  for (const section of sectionsFor(form, state.track)) {
    const found = suggestions[section.id];
    if (!found) continue;

    result = merged || result;

if (typeof module !== "undefined") {
  module.exports = {
    sectionsFor, fieldsFor, linesToList, listToLines, collectBundle, draftBundle, isBlankItem, stateFromBundle,
    setValue, addItem, removeItem, applySuggestions, cleanSuggestions, confirmSuggestions, uncheckedSuggestions, BundleError,
  };
}

// DOM building blocks of the template. Values from the person or a loaded file are only ever set as
// text or form values, never as HTML.
"use strict";

/** Create an element; attrs are properties (on* handlers, dataset, aria via setAttribute). */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "dataset") Object.assign(node.dataset, value);
    else if (key.startsWith("aria-") || key === "role" || key === "for") node.setAttribute(key, value);
    else node[key] = value;
  }
  for (const child of [].concat(children || [])) {
    if (child === null || child === undefined || child === false) continue;
    node.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

let idCounter = 0;
const nextId = (prefix) => `${prefix}-${++idCounter}`;

/**
 * One field with label, hint, control and error slot.
 * ctx: { track, value, path (string), onChange(value), onBlur() }
 */
function fieldView(field, ctx) {
  const id = nextId("f");
  const hint = forTrack(field.hint, ctx.track);
  const hintId = hint ? `${id}-hint` : null;
  const errorId = `${id}-error`;
  const describedBy = [hintId, errorId].filter(Boolean).join(" ");
  const label = forTrack(field.label, ctx.track) + (field.required ? " *" : "");
  const control = controlView(field, ctx, id, describedBy);
  const isCantons = field.control === "cantons";
  const isGroup = field.type === "choice" || isCantons;
  return el("div", { className: `field field-${field.type}`, dataset: { path: ctx.path } }, [
    isGroup ? null : el("label", { for: id }, label),
    isGroup ? null : hint ? el("p", { className: "hint", id: hintId }, hint) : null,
    isCantons ? cantonsView(field, ctx, label, hint, hintId, errorId)
      : isGroup ? choiceView(field, ctx, id, label, hint, hintId, errorId) : control,
    el("p", { className: "error", id: errorId, role: "alert" }),
  ]);
}

function controlView(field, ctx, id, describedBy) {
  if (field.control === "cantons") return null;
  const common = { id, "aria-describedby": describedBy, "aria-required": field.required ? "true" : null, onblur: () => ctx.onBlur() };
  if (field.type === "textarea") {
    return el("textarea", { ...common, rows: 4, value: ctx.value || "", oninput: (e) => ctx.onChange(e.target.value) });
  }
  if (field.type === "list") {
    const text = listToLines(ctx.value);
    return el("textarea", {
      ...common, rows: Math.max(3, text.split("\n").length + 1), value: text,
      placeholder: "Eine Angabe pro Zeile", oninput: (e) => ctx.onChange(linesToList(e.target.value)),
    });
  }
  if (field.type === "select") {
    const select = el("select", { ...common, onchange: (e) => ctx.onChange(e.target.value) }, [
      el("option", { value: "" }, "– bitte wählen –"),
      ...field.options.map((o) => el("option", { value: o, selected: o === ctx.value }, o)),
    ]);
    return select;
  }
  if (field.type === "choice") return null;
  const type = field.format === "email" ? "email" : field.format === "phone" ? "tel" : "text";
  return el("input", {
    ...common, type, value: ctx.value || "", placeholder: field.placeholder || "",
    autocomplete: autocompleteFor(ctx.path), oninput: (e) => ctx.onChange(e.target.value),
  });
}

function autocompleteFor(path) {
  const map = { "person.name": "name", "person.email": "email", "person.phone": "tel", "person.address": "street-address",
    "person.postalCode": "postal-code", "person.city": "address-level2" };
  return map[path] || "off";
}

/** Radio group of suggested texts plus an own formulation. */
/** Names instead of codes: the answer stays the list of codes the search and the checks know. */
function cantonsView(field, ctx, label, hint, hintId, errorId) {
  const chosen = new Set(ctx.value || []);
  const changed = (e) => {
    const boxes = e.target.closest(".canton-list").querySelectorAll("input:checked");
    ctx.onChange([...boxes].map((box) => box.value));
  };
  return el("fieldset", { className: "choice cantons", "aria-describedby": [hintId, errorId].filter(Boolean).join(" ") }, [
    el("legend", {}, label),
    hint ? el("p", { className: "hint", id: hintId }, hint) : null,
    el("div", { className: "canton-list" }, ctx.cantons.map((canton) => el("label", { className: "option" }, [
      el("input", {
        type: "checkbox", value: canton.code, checked: chosen.has(canton.code),
        onchange: changed, onblur: () => ctx.onBlur(),
      }),
      el("span", {}, canton.name),
    ]))),
  ]);
}

function choiceView(field, ctx, id, label, hint, hintId, errorId) {
  const options = forTrack(field.options, ctx.track) || [];
  const value = ctx.value || "";
  const isOwn = value !== "" && !options.includes(value);
  const ownInput = el("input", {
    type: "text", value: isOwn ? value : "", className: "own", "aria-label": "Eigene Formulierung",
    oninput: (e) => { ownRadio.checked = true; ctx.onChange(e.target.value); }, onblur: () => ctx.onBlur(),
  });
  const ownRadio = el("input", {
    type: "radio", name: id, checked: isOwn,
    onchange: () => { ownInput.focus(); ctx.onChange(ownInput.value); },
  });
  const radios = options.map((option) => el("label", { className: "option" }, [
    el("input", { type: "radio", name: id, value: option, checked: option === value, onchange: () => ctx.onChange(option), onblur: () => ctx.onBlur() }),
    el("span", {}, option),
  ]));
  return el("fieldset", {
    className: "choice", role: "radiogroup", "aria-required": field.required ? "true" : null,
    "aria-describedby": [hintId, errorId].filter(Boolean).join(" "),
  }, [
    el("legend", {}, label),
    hint ? el("p", { className: "hint", id: hintId }, hint) : null,
    ...radios,
    field.allowOwn ? el("label", { className: "option own-option" }, [ownRadio, el("span", {}, "Eigene Formulierung:"), ownInput]) : null,
  ]);
}

/** Show the given messages in the error slots of the rendered fields (matching path or sub-paths). */
function showErrors(root, messagesByPath, visiblePaths) {
  for (const node of root.querySelectorAll(".field[data-path]")) {
    const path = node.dataset.path;
    const own = Object.entries(messagesByPath)
      .filter(([p]) => p === path || p.startsWith(`${path}.`))
      .map(([, m]) => m);
    const visible = visiblePaths.has(path) && own.length > 0;
    node.querySelector(".error").textContent = visible ? own.join(" ") : "";
    node.classList.toggle("invalid", visible);
    for (const control of node.querySelectorAll("input, textarea, select")) {
      if (visible) control.setAttribute("aria-invalid", "true");
      else control.removeAttribute("aria-invalid");
    }
  }
}

if (typeof module !== "undefined") {
  module.exports = { el, fieldView, showErrors };
}

// Rules for uploaded documents, for the browser. Mirrors documents.py; both run the shared
// "documentCases" in tests/cases.json. An entry is { category, name, size }.
"use strict";

const BYTES_PER_MB = 1000000;
const MAX_NAME_CHARS = 120;
const FALLBACK_NAME = "unterlage";
const DOCUMENT_MESSAGES = {
  type: "Unerwarteter Eintrag.",
  category: "Unbekannte Art von Unterlage.",
  name: "Ungültiger Dateiname.",
  extension: "Dieser Dateityp geht nicht. Erlaubt sind {allowed}.",
  size: "Die Datei ist zu gross (höchstens {maxFileMB} MB).",
  duplicate: "Diese Datei ist schon dabei.",
  maxFiles: "Zu viele Dateien (höchstens {maxFiles}).",
  total: "Zusammen sind die Dateien zu gross (höchstens {maxTotalMB} MB).",
};

const titleForTrack = (value, track) => (value !== null && typeof value === "object" ? value[track] : value);
const isDocumentObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const isSize = (v) => typeof v === "number" && Number.isInteger(v) && v > 0;

function documentCategories(form) {
  return new Map(form.documents.categories.map((c) => [c.id, c]));
}

function documentExtension(name) {
  const dot = name.lastIndexOf(".");
  return dot < 0 ? "" : name.slice(dot + 1).toLowerCase();
}

/** File extensions a category accepts, from its file types (e.g. images only for certificates). */
function allowedExtensions(form, category) {
  const types = form.documents.fileTypes;
  return category.fileTypes.flatMap((t) => types[t].extensions);
}

/** German list of the accepted file types, e.g. „PDF, Word (.docx, .doc) und Textdateien (.txt)“. */
function allowedText(form, category) {
  const types = form.documents.fileTypes;
  const labels = category.fileTypes.flatMap((t) => types[t].labels);
  return labels.length === 1 ? labels[0] : `${labels.slice(0, -1).join(", ")} und ${labels[labels.length - 1]}`;
}

function validateDocuments(form, entries) {
  if (!Array.isArray(entries)) return [{ path: "documents", code: "type" }];
  const rules = form.documents;
  const known = documentCategories(form);
  const errors = [];
  const seen = new Set();
  const counts = new Map();
  let total = 0;
  entries.forEach((entry, index) => {
    const code = documentEntryError(form, known, entry, seen);
    if (code) errors.push({ path: `documents.${index}`, code });
    if (isDocumentObject(entry) && typeof entry.category === "string" && known.has(entry.category)) {
      counts.set(entry.category, (counts.get(entry.category) || 0) + 1);
    }
    if (isDocumentObject(entry) && isSize(entry.size)) total += entry.size;
  });
  for (const [id, count] of counts) {
    if (count > known.get(id).maxFiles) errors.push({ path: `documents.${id}`, code: "maxFiles" });
  }
  if (total > rules.maxTotalBytes) errors.push({ path: "documents", code: "total" });
  return errors;
}

function documentEntryError(form, known, entry, seen) {
  const rules = form.documents;
  if (!isDocumentObject(entry)) return "type";
  const { category, name, size } = entry;
  if (typeof category !== "string" || !known.has(category)) return "category";
  if (typeof name !== "string" || !new RegExp(rules.namePattern, "u").test(name)) return "name";
  if (!allowedExtensions(form, known.get(category)).includes(documentExtension(name))) return "extension";
  if (!isSize(size) || size > rules.maxFileBytes) return "size";
  const key = `${category}/${name.toLowerCase()}`;
  if (seen.has(key)) return "duplicate";
  seen.add(key);
  return null;
}

/** German message: category and file name, then what is wrong. */
function describeDocument(form, track, entries, error) {
  const rules = form.documents;
  const known = documentCategories(form);
  const parts = error.path.split(".");
  const params = {
    maxFileMB: Math.floor(rules.maxFileBytes / BYTES_PER_MB),
    maxTotalMB: Math.floor(rules.maxTotalBytes / BYTES_PER_MB),
    maxFiles: "?",
    allowed: "?",
  };
  let where = "";
  if (parts.length === 2 && known.has(parts[1])) {
    const category = known.get(parts[1]);
    params.maxFiles = category.maxFiles;
    where = titleForTrack(category.title, track);
  } else if (parts.length === 2 && /^[0-9]+$/.test(parts[1]) && Number(parts[1]) < entries.length) {
    const entry = entries[Number(parts[1])];
    if (isDocumentObject(entry)) {
      const category = typeof entry.category === "string" ? known.get(entry.category) : undefined;
      if (category) params.allowed = allowedText(form, category);
      where = [category ? titleForTrack(category.title, track) : "", entry.name]
        .filter((n) => typeof n === "string" && n).join(", ");
    }
  }
  const text = (DOCUMENT_MESSAGES[error.code] || error.code).replace(/\{(\w+)\}/g, (_, k) => params[k]);
  return where ? `${where}: ${text}` : text;
}

/** A file name from the person's computer, made safe: no folders, no special characters, at most 120 characters. */
function safeDocumentName(raw) {
  const base = String(raw).normalize("NFC").split(/[\\/]/).pop();
  let name = base.replace(/[:*?"<>|\u0000-\u001f\u007f]/g, "-").replace(/^[.\s]+/, "").replace(/[.\s]+$/, "");
  if (!/[^\-.\s]/.test(name)) return FALLBACK_NAME;
  const chars = Array.from(name);
  if (chars.length <= MAX_NAME_CHARS) return name;
  const ext = documentExtension(name);
  const suffix = ext && ext.length < 10 ? `.${ext}` : "";
  return chars.slice(0, MAX_NAME_CHARS - suffix.length).join("").replace(/[.\s]+$/, "") + suffix;
}

// Uploads in the template: which chosen files to take, and the ZIP layout shared with archive.py.

const UPLOAD_BUNDLE = "einstieg.json";
const UPLOAD_DIR = "dokumente";

/** A ZIP that is no file of this template; the message is German and shown as is. */
class UploadError extends Error {}

/**
 * Which of the chosen files (each { name, size }) to add to a category, checked against the rules
 * together with what is already there. Returns { accepted: [{ index, category, name, size }], messages }.
 */
function planUploads(form, track, current, category, chosen) {
  const accepted = [];
  const messages = [];
  chosen.forEach((file, index) => {
    const entry = { category, name: safeDocumentName(file.name), size: file.size };
    const entries = [...current, ...accepted, entry].map(({ category: c, name, size }) => ({ category: c, name, size }));
    const [error] = validateDocuments(form, entries).filter((e) => isAbout(e, entries.length - 1, category));
    if (error) messages.push(describeDocument(form, track, entries, error)); // one message per file is enough
    else accepted.push({ index, ...entry });
  });
  return { accepted, messages };
}

function isAbout(error, last, category) {
  return error.path === `documents.${last}` || error.path === `documents.${category}` || error.path === "documents";
}

/** ZIP entries for the saved file: the answers plus each upload under dokumente/<category>/<name>. */
function uploadZipEntries(bundleBytes, uploads) {
  return [
    { name: UPLOAD_BUNDLE, data: bundleBytes },
    ...uploads.map((u) => ({ name: `${UPLOAD_DIR}/${u.category}/${u.name}`, data: u.data })),
  ];
}

/** Split the entries of a loaded ZIP into the answers (bytes) and uploads; throws UploadError. */
function splitUploadZip(form, entries) {
  const bundles = entries.filter((e) => e.name === UPLOAD_BUNDLE);
  if (bundles.length !== 1) throw new UploadError(`Die Datei muss genau eine ${UPLOAD_BUNDLE} enthalten.`);
  const uploads = entries.filter((e) => e.name !== UPLOAD_BUNDLE).map((e) => {
    const parts = e.name.split("/");
    if (parts.length !== 3 || parts[0] !== UPLOAD_DIR) throw new UploadError(`Unerwarteter Inhalt in der Datei: ${e.name}`);
    return { category: parts[1], name: parts[2], size: e.data.length, data: e.data };
  });
  const [error] = validateDocuments(form, uploads.map(({ category, name, size }) => ({ category, name, size })));
  if (error) throw new UploadError(describeDocument(form, "job", uploads, error));
  return { bundle: bundles[0].data, uploads };
}

/** Most entries a saved ZIP can have: the answers plus the most files of every category. */
function maxUploadEntries(form) {
  return 1 + form.documents.categories.reduce((sum, c) => sum + c.maxFiles, 0);
}

if (typeof module !== "undefined") {
  module.exports = {
    validateDocuments, describeDocument, safeDocumentName, documentCategories, documentExtension, allowedExtensions, allowedText,
    planUploads, uploadZipEntries, splitUploadZip, maxUploadEntries, UploadError,
  };
}

// Minimal ZIP writer and reader for the template: einstieg.json plus uploaded documents in one file.
// Writes stored or deflated entries with UTF-8 names; reads stored and deflated entries, checks sizes
// and CRCs and stops at the given limits. No encryption, no ZIP64, no multi-disk archives.
"use strict";

const SIG_LOCAL = 0x04034b50;
const SIG_CENTRAL = 0x02014b50;
const SIG_END = 0x06054b50;
const LOCAL_HEADER = 30;
const CENTRAL_HEADER = 46;
const END_RECORD = 22;
const MAX_COMMENT = 0xffff;
const FLAG_ENCRYPTED = 0x0001;
const FLAG_UTF8 = 0x0800;
const METHOD_STORED = 0;
const METHOD_DEFLATE = 8;
const ZIP_VERSION = 20;

class ZipError extends Error {}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(data) {
  let crc = 0xffffffff;
  for (let i = 0; i < data.length; i++) crc = CRC_TABLE[(crc ^ data[i]) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

async function streamThrough(data, transform, limit) {
  const reader = new Blob([data]).stream().pipeThrough(transform).getReader();
  const chunks = [];
  let length = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    length += value.length;
    if (limit !== undefined && length > limit) {
      await reader.cancel();
      throw new ZipError("Die Datei ist beschädigt (ein Eintrag ist grösser als angegeben).");
    }
    chunks.push(value);
  }
  const out = new Uint8Array(length);
  let offset = 0;
  for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.length; }
  return out;
}

function dosDateTime(date) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
  const day = ((Math.max(date.getFullYear(), 1980) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  return { time, day };
}

/** ZIP bytes for entries [{ name, data: Uint8Array }]; with compress, entries are deflated where that is smaller. */
async function createZip(entries, { date = new Date(), compress = false } = {}) {
  const { time, day } = dosDateTime(date);
  const encoder = new TextEncoder();
  const locals = [];
  const centrals = [];
  let offset = 0;
  for (const entry of entries) {
    const name = encoder.encode(entry.name);
    const crc = crc32(entry.data);
    let method = METHOD_STORED;
    let body = entry.data;
    if (compress) {
      const deflated = await streamThrough(entry.data, new CompressionStream("deflate-raw"));
      if (deflated.length < entry.data.length) { method = METHOD_DEFLATE; body = deflated; }
    }
    const fields = { method, time, day, crc, compressed: body.length, size: entry.data.length, name };
    const local = header(LOCAL_HEADER, SIG_LOCAL, fields);
    locals.push(local, body);
    centrals.push(header(CENTRAL_HEADER, SIG_CENTRAL, fields, offset));
    offset += local.length + body.length;
  }
  const centralSize = centrals.reduce((sum, c) => sum + c.length, 0);
  const end = new Uint8Array(END_RECORD);
  const view = new DataView(end.buffer);
  view.setUint32(0, SIG_END, true);
  view.setUint16(8, entries.length, true);
  view.setUint16(10, entries.length, true);
  view.setUint32(12, centralSize, true);
  view.setUint32(16, offset, true);
  return concat([...locals, ...centrals, end]);
}

function header(size, signature, f, offset) {
  const out = new Uint8Array(size + f.name.length);
  const v = new DataView(out.buffer);
  v.setUint32(0, signature, true);
  const central = signature === SIG_CENTRAL;
  const base = central ? 2 : 0; // the central header has "version made by" before the common fields
  if (central) v.setUint16(4, ZIP_VERSION, true);
  v.setUint16(4 + base, ZIP_VERSION, true);
  v.setUint16(6 + base, FLAG_UTF8, true);
  v.setUint16(8 + base, f.method, true);
  v.setUint16(10 + base, f.time, true);
  v.setUint16(12 + base, f.day, true);
  v.setUint32(14 + base, f.crc, true);
  v.setUint32(18 + base, f.compressed, true);
  v.setUint32(22 + base, f.size, true);
  v.setUint16(26 + base, f.name.length, true);
  if (central) v.setUint32(42, offset, true);
  out.set(f.name, size);
  return out;
}

function concat(parts) {
  const out = new Uint8Array(parts.reduce((sum, p) => sum + p.length, 0));
  let offset = 0;
  for (const part of parts) { out.set(part, offset); offset += part.length; }
  return out;
}

/** Entries [{ name, data }] of a ZIP; throws ZipError (German message) if it is damaged or exceeds the limits. */
async function readZip(bytes, { maxEntries, maxTotalBytes }) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const end = findEnd(bytes, view);
  const count = view.getUint16(end + 10, true);
  if (view.getUint16(end + 4, true) !== 0 || view.getUint16(end + 8, true) !== count) {
    throw new ZipError("ZIP-Dateien über mehrere Teile gehen nicht.");
  }
  if (count > maxEntries) throw new ZipError(`Die Datei enthält zu viele Einträge (höchstens ${maxEntries}).`);
  const decoder = new TextDecoder("utf-8", { fatal: true });
  const entries = [];
  let total = 0;
  let position = view.getUint32(end + 16, true);
  for (let i = 0; i < count; i++) {
    const entry = centralEntry(bytes, view, position, decoder);
    position = entry.next;
    if (entry.name.endsWith("/")) continue;
    total += entry.size;
    if (total > maxTotalBytes) throw new ZipError(`Der Inhalt ist zu gross (höchstens ${Math.floor(maxTotalBytes / 1000000)} MB).`);
    entries.push({ name: entry.name, data: await entryData(bytes, view, entry) });
  }
  return entries;
}

function findEnd(bytes, view) {
  const lowest = Math.max(0, bytes.length - END_RECORD - MAX_COMMENT);
  for (let i = bytes.length - END_RECORD; i >= lowest; i--) {
    if (view.getUint32(i, true) === SIG_END) return i;
  }
  throw new ZipError("Die Datei ist keine ZIP-Datei.");
}

function centralEntry(bytes, view, at, decoder) {
  if (at + CENTRAL_HEADER > bytes.length || view.getUint32(at, true) !== SIG_CENTRAL) {
    throw new ZipError("Die Datei ist beschädigt (Inhaltsverzeichnis).");
  }
  const flags = view.getUint16(at + 8, true);
  if (flags & FLAG_ENCRYPTED) throw new ZipError("Verschlüsselte ZIP-Dateien gehen nicht.");
  const nameLength = view.getUint16(at + 28, true);
  const next = at + CENTRAL_HEADER + nameLength + view.getUint16(at + 30, true) + view.getUint16(at + 32, true);
  if (next > bytes.length) throw new ZipError("Die Datei ist beschädigt (Inhaltsverzeichnis).");
  let name;
  try {
    name = decoder.decode(bytes.subarray(at + CENTRAL_HEADER, at + CENTRAL_HEADER + nameLength));
  } catch (error) {
    throw new ZipError("Ein Dateiname in der ZIP-Datei ist ungültig.");
  }
  return {
    name, next, method: view.getUint16(at + 10, true), crc: view.getUint32(at + 16, true),
    compressed: view.getUint32(at + 20, true), size: view.getUint32(at + 24, true), offset: view.getUint32(at + 42, true),
  };
}

async function entryData(bytes, view, entry) {
  const at = entry.offset;
  if (at + LOCAL_HEADER > bytes.length || view.getUint32(at, true) !== SIG_LOCAL) {
    throw new ZipError("Die Datei ist beschädigt (Eintrag nicht gefunden).");
  }
  const start = at + LOCAL_HEADER + view.getUint16(at + 26, true) + view.getUint16(at + 28, true);
  if (start + entry.compressed > bytes.length) throw new ZipError("Die Datei ist beschädigt (Eintrag abgeschnitten).");
  const raw = bytes.subarray(start, start + entry.compressed);
  let data;
  if (entry.method === METHOD_STORED) data = raw.slice();
  else if (entry.method === METHOD_DEFLATE) {
    try {
      data = await streamThrough(raw, new DecompressionStream("deflate-raw"), entry.size);
    } catch (error) {
      if (error instanceof ZipError) throw error;
      throw new ZipError(`Die Datei ist beschädigt (${entry.name}).`);
    }
  } else throw new ZipError(`Diese Art der Komprimierung geht nicht (${entry.name}).`);
  if (data.length !== entry.size || crc32(data) !== entry.crc) throw new ZipError(`Die Datei ist beschädigt (${entry.name}).`);
  return data;
}

if (typeof module !== "undefined") {
  module.exports = { crc32, createZip, readZip, ZipError };
}

// Keeps uploaded documents in this browser (IndexedDB), so they are still there after closing the page.
// localStorage is too small for documents (about 5 MB). Everything stays on the device; "Alles löschen"
// removes it. Without IndexedDB (e.g. some private windows) the functions report failure and the page
// keeps the files in memory only.
"use strict";

const UPLOAD_DB_NAME = "bewerbungsassistent.einstieg";
const UPLOAD_DB_VERSION = 1;
const UPLOAD_DB_STORE = "uploads";
const UPLOAD_DB_KEY = "current";

function openUploadDb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB not available"));
      return;
    }
    const request = indexedDB.open(UPLOAD_DB_NAME, UPLOAD_DB_VERSION);
    request.onupgradeneeded = () => request.result.createObjectStore(UPLOAD_DB_STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("IndexedDB blocked"));
  });
}

/** Run one request in a transaction and resolve with its result once the transaction is done. */
async function withUploadStore(mode, makeRequest) {
  const db = await openUploadDb();
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction(UPLOAD_DB_STORE, mode);
      const request = makeRequest(transaction.objectStore(UPLOAD_DB_STORE));
      transaction.oncomplete = () => resolve(request.result);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error || new Error("IndexedDB aborted"));
    });
  } finally {
    db.close();
  }
}

/** Store the uploads ({ category, name, size, data }); true if they are kept in this browser. */
async function keepUploads(list) {
  try {
    const copy = list.map(({ category, name, size, data }) => ({ category, name, size, data }));
    await withUploadStore("readwrite", (store) => (copy.length ? store.put(copy, UPLOAD_DB_KEY) : store.delete(UPLOAD_DB_KEY)));
    return true;
  } catch (error) {
    return false;
  }
}

/** Uploads kept in this browser, or [] if there are none or they cannot be read. */
async function keptUploads() {
  try {
    const stored = await withUploadStore("readonly", (store) => store.get(UPLOAD_DB_KEY));
    return Array.isArray(stored) ? stored.filter(isKeptUpload) : [];
  } catch (error) {
    return [];
  }
}

function isKeptUpload(u) {
  return u !== null && typeof u === "object" && typeof u.category === "string" && typeof u.name === "string"
    && u.data instanceof Uint8Array && u.size === u.data.length;
}

"use strict";

const BASE64_CHUNK = 0x8000;

function toBase64(bytes) {
  let binary = "";
  for (let i = 0; i < bytes.length; i += BASE64_CHUNK) {
    binary += String.fromCharCode(...bytes.subarray(i, i + BASE64_CHUNK));
  }
  return btoa(binary);
}

function createAppBackend() {
  const token = document.querySelector('meta[name="token"]').content;

  async function answer(response) {
    const body = await response.json().catch(() => ({}));
    if (response.ok) return body;
    const error = new Error(body.fehler || "Die App antwortet nicht. Läuft sie noch?");
    error.status = response.status;
    error.existing = Boolean(body.vorhanden);
    throw error;
  }

  const post = (path, body) => fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json", "X-Token": token }, body: JSON.stringify(body),
  }).then(answer);

  return {
    overview: () => fetch(`/api/angaben/stand?${new URLSearchParams({ t: token })}`).then(answer),
    keep: (stand) => post("/api/angaben/stand", { stand }),
    discard: () => post("/api/angaben/stand-loeschen", {}),
    addDocument: (track, category, name, bytes) => post("/api/angaben/unterlage", { track, category, name, data: toBase64(bytes) }),
    removeDocument: (datei) => post("/api/angaben/unterlage-entfernen", { datei }),
    prefill: (track, data) => post("/api/angaben/vorbefuellen", { track, data }),
    takeOver: (bundle, ersetzen) => post("/api/angaben/uebernehmen", { bundle, ersetzen }),
  };
}

function applyStored(stored) {
  if (stored && isTrack(form, stored.track)) {
    const marks = cleanSuggestions(stored.suggested);
    state = {
      ...stateFromBundle(form, { format: form.format, version: form.version, track: stored.track, data: stored.data }),
      ...(Object.keys(marks).length ? { suggested: marks } : {}),
    };
    step = Number.isInteger(stored.step) ? Math.max(0, stored.step) : 0;
  }

async function loadStored() {
  try {
    if (backend) {
      const overview = await backend.overview();
      applyStored(overview.stand);
      notTakenOver = Boolean(overview.stand && overview.stand.offen === true);
      uploads = overview.unterlagen;
      existingBasics = overview.vorhanden;
      return;
    }
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) applyStored(JSON.parse(raw));
  } catch (error) {
    if (backend) appProblem = error.message;
    else setStatus("Gespeicherte Eingaben konnten nicht gelesen werden.");
  }
}

function storeNow() {
  if (backend) {
    backend.keep({ track: state.track, data: state.data, suggested: state.suggested, step, offen: notTakenOver })

      .catch((error) => setStatus(`Zwischenspeichern hat nicht geklappt: ${error.message}`));

  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ track: state.track, data: state.data, step }));

}

  if (backend) {

// State changes

function update(newState, { rerender = false } = {}) {
  if (newState.data !== state.data || newState.track !== state.track) notTakenOver = true;
  state = newState;
  scheduleStore();
  if (rerender) render();
}

function goTo(newStep) {
  step = Math.max(0, Math.min(newStep, steps().length - 1));
  uploadMessages = [];
  scheduleStore();
  render();
  document.getElementById("main").focus();
  window.scrollTo(0, 0);
}

function steps() {
  if (!state.track) return [{ kind: "start" }];
  return [
    { kind: "start" }, { kind: "documents" },
    ...sectionsFor(form, state.track).map((s) => ({ kind: "section", section: s })), { kind: "finish" },
  ];
}

// Validation shown in the page

function currentErrors() {
  const errors = validateBundle(form, draftBundle(form, state));
  return errors.filter((e) => {
    const [sectionId, index] = e.path.split(".");
    const list = state.data[sectionId];
    return !(Array.isArray(list) && /^\d+$/.test(index || "") && isBlankItem(list[Number(index)]));
  });
}

function refreshErrors() {
  const byPath = {};
  for (const error of currentErrors()) {
    byPath[error.path] = [byPath[error.path], messageText(form, state.track, error)].filter(Boolean).join(" ");
  }
  showErrors(document.getElementById("main"), byPath, touched);
}

// Rendering

function render() {
  const all = steps();
  if (step >= all.length) step = all.length - 1;
  renderNav(all);
  const main = document.getElementById("main");
  const current = all[step];
  main.replaceChildren(viewFor(current), navButtons(all));
  refreshErrors();
}

function viewFor(current) {
  if (current.kind === "start") return startView();
  if (current.kind === "documents") return documentsView();
  if (current.kind === "finish") return finishView();
  return sectionView(current.section);
}

function stepTitle(s) {
  if (s.kind === "start") return "Start";
  if (s.kind === "documents") return forTrack(form.documents.title, state.track);
  if (s.kind === "finish") return backend ? "Übernehmen" : "Speichern";
  return forTrack(s.section.title, state.track);
}

function renderNav(all) {
  const errorSections = new Set(currentErrors().map((e) => e.path.split(".")[0]));
  const items = all.map((s, i) => {
    const title = stepTitle(s);
    const flagged = s.kind === "section" && errorSections.has(s.section.id);
    const suggested = s.kind === "section" && sectionHasSuggestion(s.section.id);
    return el("li", {}, el("button", {
      type: "button", className: `step${i === step ? " current" : ""}${flagged ? " flagged" : ""}${suggested ? " suggested" : ""}`,
      "aria-current": i === step ? "step" : null, onclick: () => goTo(i),
    }, title));
  });
  document.getElementById("steps").replaceChildren(el("ol", {}, items), ...notTakenOverNote(all));
}

/** Changes count only after „Übernehmen“; easy to forget when the search is what one is after. */
function notTakenOverNote(all) {
  if (!backend || !notTakenOver || all[step].kind === "finish") return [];
  const text = state.track === "apprenticeship" ? "Deine Änderungen sind noch nicht übernommen." : "Ihre Änderungen sind noch nicht übernommen.";
  return [el("p", { className: "not-taken-over" }, [
    `${text} `, el("button", { type: "button", className: "link", onclick: () => goTo(all.length - 1) }, "Zum Übernehmen"),
  ])];
}

/** The search leads here with #feld=<path> (or #feld=uebernehmen): open that step and show the field. */
function openFromAddress() {
  const wanted = new URLSearchParams(window.location.hash.slice(1)).get("feld");
  if (!backend || !wanted) return;
  window.history.replaceState(null, "", window.location.pathname + window.location.search);
  if (!state.track) {
    // Imported files without a state of this page: starting over here would ask for everything again.
    profileHint = existingBasics.length > 0;
    return render();
  }
  const all = steps();
  const index = wanted === TAKE_OVER_TARGET ? all.length - 1
    : all.findIndex((s) => s.kind === "section" && s.section.id === wanted.split(".")[0]);
  if (index < 0) return;
  goTo(index);
  const field = [...document.querySelectorAll("[data-path]")].find((f) => f.dataset.path === wanted);
  if (!field) return;
  field.classList.add("wanted");
  field.prepend(el("p", { className: "wanted-note" }, WANTED_NOTE));
  field.scrollIntoView({ block: "center" });
  (field.querySelector("input, textarea, select") || field).focus();
}

function startView() {
  const choose = (track) => {
    update({ ...state, track });
    touched = new Set();
    goTo(1);
  };
  const trackButton = (track, title, text) => el("button", {
    type: "button", className: `track${state.track === track ? " selected" : ""}`,
    "aria-pressed": String(state.track === track), onclick: () => choose(track),
  }, [el("strong", {}, title), el("span", {}, text)]);
  const fileInput = el("input", { type: "file", accept: ".json,.zip,application/json,application/zip", className: "visually-hidden", tabIndex: -1, "aria-hidden": "true", onchange: loadFile });
  return el("section", { className: "start" }, [
    el("h2", {}, "Worum geht es?"),
    el("p", {}, `Hier erfassen Sie Schritt für Schritt alles, was der Bewerbungsassistent braucht: Lebenslauf, Suche, Stärken und Ton der Anschreiben. ${backend ? "Am Schluss übernehmen Sie alles in die App." : "Am Schluss speichern Sie eine Datei."}`),
    profileHint ? el("p", { className: "wanted-note" }, ["Das steht in Ihrem Suchprofil, Abschnitt „Region“. Am einfachsten ergänzen Sie es unter ", el("a", { href: "/inhalte" }, "Inhalte"), "."]) : null,
    appProblem ? el("p", { className: "error", role: "alert" }, [`${appProblem} `, el("a", { href: "/einrichtung" }, "Zur Einrichtung")]) : null,
    existingBasics.length ? el("p", { className: "hint" }, ["Ihre Grundlagen sind schon im Datenordner. Kleine Änderungen machen Sie am einfachsten unter ", el("a", { href: "/inhalte" }, "Inhalte"), "."]) : null,
    el("div", { className: "tracks" }, [
      trackButton("job", "Ich suche eine Stelle", "Lebenslauf, Anschreiben und Stellensuche"),
      trackButton("apprenticeship", "Ich suche eine Lehrstelle", "Für Schülerinnen und Schüler: Schnupperlehren, Schule, Motivationsschreiben"),
    ]),
    el("p", { className: "secondary" }, [
      "Schon angefangen oder von Claude vorbereitet? ",
      el("button", { type: "button", className: "link", onclick: () => fileInput.click() }, "Datei laden"),
      fileInput,
    ]),
    el("p", { className: "secondary" }, EXISTING_DOCUMENTS_NOTE),
    el("p", { id: "load-message", role: "status" }),
  ]);
}

function documentsView() {
  return uploadsView({
    form, track: state.track, uploads, messages: uploadMessages, kept: uploadsKept,
    app: Boolean(backend), extra: backend ? prefillArea() : null,
    onAdd: addUploads, onRemove: removeUpload, onSkip: () => goTo(steps().length - 1),
  });
}

// Suggestions from documents (page of the app)

const sectionTitle = (id) => forTrack(form.sections.find((s) => s.id === id).title, state.track);

function sectionHasSuggestion(id) {
  return Object.keys(state.suggested || {}).some((key) => key.split(".")[0] === id);
}

function goToSection(id) {
  goTo(steps().findIndex((s) => s.kind === "section" && s.section.id === id));
}

function prefillArea() {
  return prefillView({
    track: state.track, run: prefillRun, uploads,
    hasName: Boolean(((state.data.person || {}).name || "").trim()) || existingBasics.includes("cv.yaml"),
    titleOf: sectionTitle, onRun: runPrefill, onGoTo: goToSection,
  });
}

function forgetPrefillRun() {
  prefillTurn += 1;
  prefillRun = { running: false, problem: null, report: null };
}

/** The person may be typing elsewhere meanwhile: the new values must show at once, and the focus stays. */
function renderKeepingFocus() {
  const path = document.activeElement?.closest?.("[data-path]")?.dataset.path;
  render();
  if (path) focusFirst(`[data-path="${path}"]`);
}

async function runPrefill() {
  const turn = ++prefillTurn;
  const track = state.track;
  prefillRun = { running: true, problem: null, report: null };
  render();
  let finished;
  try {
    const answer = await backend.prefill(track, state.data);
    if (turn !== prefillTurn || track !== state.track) return;
    const merged = applySuggestions(form, state, answer.suggestions);
    update(merged.state);
    finished = { problem: null, report: prefillReport(answer, merged) };
  } catch (error) {
    if (turn !== prefillTurn) return;
    finished = { problem: error.message, report: null };
  }
  prefillRun = { running: false, ...finished };
  renderKeepingFocus();
  if (steps()[step].kind !== "documents") setStatus(finished.problem || PREFILL_TEXT[track].finished);
}

function confirmSuggestion(key) {
  update(confirmSuggestions(state, [key]), { rerender: true });
}

function suggestionNote(key) {
  const source = (state.suggested || {})[key];
  return source ? suggestionMark(key, source, confirmSuggestion) : null;
}

/** One upload or removal after the other, so the list from the app is always the latest one. */
function inTurn(work) {
  uploadTurn = uploadTurn.then(work);
  return uploadTurn;
}

/** The person may have moved on while a large file was on its way. */
function focusOnDocuments(category) {
  if (steps()[step].kind === "documents") focusFirst(`[data-category="${category}"]`);
}

/** In the app every document goes straight to the data folder; the list of the app is the truth afterwards. */
async function sendDocuments(entries, messages) {
  let list = uploads;
  const problems = [...messages];
  for (const entry of entries) {
    try {
      list = (await backend.addDocument(state.track, entry.category, entry.name, entry.data)).unterlagen;
    } catch (error) {
      problems.push(`${entry.name}: ${error.message}`);
    }
  }
  setUploads(list, problems);
}

async function sendChosen(category, chosen) {
  const { accepted, messages } = planUploads(form, state.track, uploads, category, chosen);
  let read;
  try {
    read = await Promise.all(accepted.map(async ({ index, ...entry }) => (
      { ...entry, data: new Uint8Array(await chosen[index].arrayBuffer()) })));
  } catch (error) {
    setUploads(uploads, [...messages, "Eine Datei liess sich nicht lesen. Bitte nochmals wählen."]);
    return;
  }
  await sendDocuments(read, messages);
  focusOnDocuments(category);
}

async function addUploads(category, fileList) {
  const chosen = Array.from(fileList);
  if (backend) return inTurn(() => sendChosen(category, chosen));
  const { accepted, messages } = planUploads(form, state.track, uploads, category, chosen);
  try {
    const read = await Promise.all(accepted.map(async ({ index, ...entry }) => (
      { ...entry, data: new Uint8Array(await chosen[index].arrayBuffer()) })));
    setUploads([...uploads, ...read], messages);
  } catch (error) {
    setUploads(uploads, [...messages, "Eine Datei liess sich nicht lesen. Bitte nochmals wählen."]);
  }
  focusFirst(`[data-category="${category}"]`);
}

async function removeUpload(index) {
  const { category, datei } = uploads[index];
  if (backend) {
    return inTurn(async () => {
      try {
        setUploads((await backend.removeDocument(datei)).unterlagen, []);
      } catch (error) {
        setUploads(uploads, [error.message]);
      }
      focusOnDocuments(category);
    });
  }
  setUploads(uploads.filter((_, i) => i !== index), []);
  focusFirst(`[data-category="${category}"]`);
}

function setUploads(list, messages) {
  uploads = list;
  uploadMessages = messages;
  uploadsSaved = backend ? true : list.length === 0;
  if (!backend || ["documents", "finish"].includes(steps()[step].kind)) render();
  if (!backend) keepUploadsNow();
}

async function keepUploadsNow() {
  const kept = await keepUploads(uploads);
  if (kept !== uploadsKept) {
    uploadsKept = kept;
    if (steps()[step].kind === "documents") render();
  }
  if (kept) uploadsSaved = true;
}

/** Uploads kept from an earlier visit; only those that still pass the rules. */
async function restoreUploads() {
  if (backend) return; // loadStored brought the list of the app
  const kept = await keptUploads();
  const valid = kept.filter((u, i) => validateDocuments(form, kept.slice(0, i + 1).map(({ category, name, size }) => ({ category, name, size })))
    .every((e) => e.path !== `documents.${i}`));
  if (!valid.length) return;
  uploads = valid;
  render();
}

function sectionView(section) {
  const track = state.track;
  const intro = forTrack(section.intro, track);
  const hasRequired = fieldsFor(section, track).some((f) => f.required);
  const header = [
    el("h2", {}, forTrack(section.title, track)),
    intro ? el("p", { className: "intro" }, intro) : null,
    hasRequired ? el("p", { className: "hint" }, REQUIRED_NOTE) : null,
  ];
  if (!section.repeat) {
    const item = state.data[section.id] || {};
    return el("section", {}, [...header, suggestionNote(section.id), ...fieldsFor(section, track).map((f) => fieldFor(section, f, [section.id, f.id], item[f.id]))]);
  }
  const list = Array.isArray(state.data[section.id]) ? state.data[section.id] : [];
  const max = section.maxItems ?? form.limits.repeatItems;
  const itemTitle = forTrack(section.itemTitle, track);
  const items = list.map((item, index) => el("fieldset", { className: "item", dataset: { item: `${section.id}.${index}` } }, [
    el("legend", {}, `${itemTitle} ${index + 1}`),
    suggestionNote(`${section.id}.${index}`),
    ...fieldsFor(section, track).map((f) => fieldFor(section, f, [section.id, index, f.id], item[f.id])),
    el("button", {
      type: "button", className: "remove",
      onclick: () => {
        update(removeItem(state, section.id, index), { rerender: true });
        focusFirst(`[data-item="${section.id}.${index}"]`, `[data-item="${section.id}.${index - 1}"]`, ".add", "h2");
      },
    }, `${itemTitle} ${index + 1} entfernen`),
  ]));
  const add = list.length < max
    ? el("button", {
      type: "button", className: "add",
      onclick: () => {
        update(addItem(state, section.id), { rerender: true });
        focusFirst(`[data-item="${section.id}.${list.length}"]`);
      },
    }, `+ ${itemTitle} hinzufügen`)
    : el("p", { className: "hint" }, `Höchstens ${max} Einträge.`);
  return el("section", {}, [...header, ...items, add]);
}

/** After a rerender: focus the first control inside the first selector that matches (headings get focus too). */
function focusFirst(...selectors) {
  const main = document.getElementById("main");
  for (const selector of selectors) {
    const target = main.querySelector(selector);
    if (!target) continue;
    const control = target.matches(FOCUSABLE) ? target : target.querySelector(FOCUSABLE);
    if (control) return control.focus();
    target.tabIndex = -1;
    return target.focus();
  }
  return main.focus();
}

function fieldFor(section, field, path, value) {
  const pathText = path.join(".");
  return fieldView(field, {
    track: state.track, value, path: pathText, cantons: form.cantons,
    onChange: (v) => update(setValue(state, path, v)),
    onBlur: () => { touched = new Set(touched).add(pathText); refreshErrors(); },
  });
}

function finishView() {
  const text = TEXT[state.track];
  const errors = currentErrors();
  const onlyMissing = uploads.length > 0 && errors.every((e) => e.code === "required");
  const summary = errors.length
    ? el("div", { className: "summary" }, [
      el("p", {}, onlyMissing ? text.finishFromDocuments : (backend ? APP_TEXT[state.track].finishErrors : text.finishErrors)),
      el("ul", {}, errors.map((e) => el("li", {}, el("button", {
        type: "button", className: "link", onclick: () => goTo(stepOf(e.path)),
      }, describe(form, state.track, e))))),
    ])
    : el("p", { className: "ok" }, text.finishOk);
  const confirmBox = el("p", { className: "confirm", hidden: true }, [
    backend ? "Alle Eingaben dieser Seite verwerfen? Hochgeladene Unterlagen und schon übernommene Angaben bleiben. " : "Alle Eingaben auf diesem Gerät löschen? ",
    el("button", { type: "button", className: "danger", onclick: clearAll }, backend ? "Ja, verwerfen" : "Ja, löschen"),
    " ",
    el("button", { type: "button", onclick: () => { confirmBox.hidden = true; } }, "Abbrechen"),
  ]);
  const unchecked = uncheckedSuggestions(form, state);
  const finishing = backend ? [
    unchecked.length ? uncheckedView({
      track: state.track, sections: [...new Set(unchecked.map((key) => key.split(".")[0]))], count: unchecked.length, titleOf: sectionTitle,
      onGoTo: goToSection, onConfirmAll: () => update(confirmSuggestions(state, unchecked), { rerender: true }),
    }) : null,
    el("button", { type: "button", className: "primary", id: "take-over", disabled: unchecked.length > 0, onclick: () => takeOver(false) }, "In die App übernehmen"),
    el("button", { type: "button", className: "danger", id: "replace", hidden: true, onclick: () => takeOver(true) }, "Vorhandene Dateien ersetzen"),
    el("p", { id: "save-message", role: "alert", className: "error" }),
    el("p", { id: "take-over-done", role: "status", className: "ok", hidden: true }),
  ] : [
    el("button", { type: "button", className: "primary", onclick: saveFile }, "Datei speichern"),
    el("p", { id: "save-message", role: "alert", className: "error" }),
    el("p", {}, text.next),
  ];
  return el("section", {}, [
    el("h2", {}, backend ? "Prüfen und übernehmen" : text.finishTitle),
    summary,
    uploads.length && !backend ? el("p", { className: "hint" }, text.documents(uploads.length)) : null,
    ...finishing,
    el("p", { className: "secondary" }, el("button", { type: "button", className: "link", onclick: () => { confirmBox.hidden = false; } }, backend ? "Eingaben verwerfen" : "Alles löschen")),
    confirmBox,
  ]);
}

function stepOf(path) {
  const sectionId = path.split(".")[0];
  const index = steps().findIndex((s) => s.kind === "section" && s.section.id === sectionId);
  touched = new Set([...touched, ...currentErrors().map((e) => fieldPath(e.path))]);
  return index < 0 ? step : index;
}

/** Path of the field an error belongs to: list errors ("searchJob.cantons.0") point to a line of the field. */
function fieldPath(errorPath) {
  const parts = errorPath.split(".");
  const isLine = parts.length > 2 && /^\d+$/.test(parts[parts.length - 1]);
  return isLine ? parts.slice(0, -1).join(".") : errorPath;
}

function navButtons(all) {
  const back = step > 0 ? el("button", { type: "button", onclick: () => goTo(step - 1) }, "Zurück") : null;
  const forward = step > 0 && step < all.length - 1
    ? el("button", { type: "button", className: "primary", onclick: () => { markStepTouched(all[step]); goTo(step + 1); } }, "Weiter")
    : null;
  return el("div", { className: "nav-buttons" }, [back, forward]);
}

function markStepTouched(current) {
  if (current.kind !== "section") return;
  const prefix = `${current.section.id}`;
  touched = new Set([...touched, ...currentErrors().filter((e) => e.path.split(".")[0] === prefix).map((e) => fieldPath(e.path))]);
}

// Taking over into the data folder (page of the app)

async function takeOver(replace) {
  if (uncheckedSuggestions(form, state).length) return render();
  const message = document.getElementById("save-message");
  const done = document.getElementById("take-over-done");
  const replaceButton = document.getElementById("replace");
  message.textContent = "";
  done.hidden = true;
  replaceButton.hidden = true;
  try {
    window.clearTimeout(autosaveTimer);
    storeNow();
    const result = await backend.takeOver(collectBundle(form, state, new Date()), replace);
    existingBasics = result.geschrieben.length ? result.geschrieben : existingBasics;
    notTakenOver = Boolean(result.unvollstaendig);
    storeNow();
    done.hidden = false;
    done.replaceChildren(
      result.unvollstaendig
        ? APP_TEXT[state.track].incomplete
        : APP_TEXT[state.track].done,
      (result.behalten || []).length ? APP_TEXT[state.track].kept(result.behalten.join(", ")) : "",
      el("a", { href: "/" }, "Zu den Bewerbungen"),
    );
  } catch (error) {
    message.textContent = error.message;
    replaceButton.hidden = !error.existing;
  }
}

// Files

async function saveFile() {
  const now = new Date();
  const json = JSON.stringify(collectBundle(form, state, now), null, 2);
  try {
    if (!uploads.length) {
      download(new Blob([json], { type: "application/json" }), fileName("json"));
      return;
    }
    const zip = await createZip(uploadZipEntries(new TextEncoder().encode(json), uploads), { date: now, compress: true });
    download(new Blob([zip], { type: "application/zip" }), fileName("zip"));
    uploadsSaved = true;
  } catch (error) {
    document.getElementById("save-message").textContent = "Speichern hat nicht geklappt. Bitte in einem aktuellen Browser nochmals versuchen.";
  }
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = el("a", { href: url, download: name });
  document.body.append(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function fileName(extension) {
  const name = ((state.data.person || {}).name || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return name ? `einstieg-${name}.${extension}` : `einstieg.${extension}`;
}

async function loadFile(event) {
  const file = event.target.files[0];
  const message = document.getElementById("load-message");
  if (!file) return;
  const isZip = /\.zip$/i.test(file.name);
  const limit = isZip ? form.documents.maxTotalBytes + MAX_FILE_BYTES + ZIP_OVERHEAD_BYTES : MAX_FILE_BYTES;
  if (file.size > limit) {
    message.textContent = "Die Datei ist zu gross für eine Einstiegsdatei.";
    return;
  }
  try {
    const loaded = isZip ? await readUploadZip(file) : { bundle: await file.text(), uploads: [] };
    state = stateFromBundle(form, JSON.parse(loaded.bundle));
    notTakenOver = true;
    forgetPrefillRun();
    if (!backend) uploads = loaded.uploads;
    uploadMessages = [];
    uploadsSaved = true;
    touched = new Set();
    goTo(1);
    storeNow();
    if (backend) await inTurn(() => sendDocuments(loaded.uploads, []));
    else keepUploadsNow();
  } catch (error) {
    const known = error instanceof BundleError || error instanceof UploadError || error instanceof ZipError;
    message.textContent = known ? error.message : "Die Datei ist keine gültige Einstiegsdatei.";
  }
}

async function readUploadZip(file) {
  const limits = { maxEntries: maxUploadEntries(form), maxTotalBytes: form.documents.maxTotalBytes + MAX_FILE_BYTES };
  const entries = await readZip(new Uint8Array(await file.arrayBuffer()), limits);
  const { bundle, uploads: found } = splitUploadZip(form, entries);
  if (bundle.length > MAX_FILE_BYTES) throw new UploadError("Die Antworten in der Datei sind zu gross.");
  return { bundle: new TextDecoder("utf-8", { fatal: true }).decode(bundle), uploads: found };
}

function clearAll() {
  window.clearTimeout(autosaveTimer);
  clearStored();
  state = { track: null, data: {} };
  forgetPrefillRun();
  if (!backend) {
    uploads = [];
    keepUploads([]);
  }
  uploadMessages = [];
  uploadsSaved = true;
  touched = new Set();
  step = 0;
  render();
  document.getElementById("main").focus();
  setStatus(backend ? "Die Eingaben dieser Seite wurden verworfen." : "Alle Eingaben auf diesem Gerät wurden gelöscht.");
}

window.addEventListener("beforeunload", (event) => {
  if (uploadsSaved) return;
  event.preventDefault();
  event.returnValue = UNSAVED_UPLOADS; // older browsers show a dialog only with a value
});

loadStored().then(() => {
  render();
  restoreUploads();
  openFromAddress();
});
</script>
</body>
</html>
