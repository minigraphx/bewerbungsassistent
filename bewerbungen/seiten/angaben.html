<script>// Validation of onboarding bundles against form.json, for the browser.
// Mirrors validation.py; both run the shared cases in tests/cases.json. The limits of tags hold for typed tags only:
// `known` names the tags already in the data folder (G24), which never block saving. In the same way `loaded`, the
// answers the app read from cv.yaml (G23), never blocks saving: an entry, a value or a line the file holds at that place
// is not checked, two-language values {de, en} included, and a section or list may keep as many entries as the file has.
"use strict";

const SINGLE_LINE = new Set(["text", "list", "select", "choice", "tags"]);
const TAGGED_LINE_KEYS = new Set(["text", "tags"]);
const LINE = "Zeile";
const TAG = "Tag";
const TAGS_NAME = "Tags";
const TOP_LEVEL_KEYS = new Set(["format", "version", "track", "data", "saved"]);

const MESSAGES = {
  required: "Bitte ausfüllen.",
  type: "Unerwarteter Wert, bitte neu eingeben.",
  max: "Zu lang (höchstens {max} Zeichen).",
  maxItems: "Zu viele Einträge (höchstens {maxItems}).",
  format: "Ungültiges Format, zum Beispiel: {example}.",
  option: "Bitte einen der vorgeschlagenen Werte wählen.",
  notBefore: "Liegt vor dem Beginn.",
  newline: "Bitte ohne Zeilenumbruch.",
  unknown: "Gehört nicht zu dieser Vorlage.",
  bundle: "Die Datei ist keine Einstiegsdatei dieser Version.",
  track: "Unbekannte Art der Suche.",
};

const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const err = (path, code) => ({ path, code });

function applies(item, track) {
  return !item.tracks || item.tracks.includes(track);
}

/** True if track names a track of the form (a string key, not inherited). */
function isTrack(form, track) {
  return typeof track === "string" && Object.prototype.hasOwnProperty.call(form.tracks, track);
}

function forTrack(value, track) {
  return isObject(value) ? value[track] : value;
}

function textLimit(form, field) {
  return field.max ?? form.limits[field.type === "textarea" ? "textarea" : "text"];
}

/** The rules of one list of tags (G24), on an entry or on a line. */
function tagRules(form) {
  return { type: "tags", format: "tag", max: form.limits.tag, maxItems: form.limits.tags };
}

/** A line with tags, as cv.yaml writes it: { text, tags }. */
function isTaggedLine(value) {
  return isObject(value) && Object.keys(value).every((k) => TAGGED_LINE_KEYS.has(k)) && typeof value.text === "string"
    && (value.tags === undefined || Array.isArray(value.tags));
}

const lineOf = (value) => (isObject(value) ? value.text : value);

/** A value as it counts when compared with cv.yaml: trimmed, blank as "", a line without tags as its text. */
function storedValue(value) {
  if (value === null || value === undefined) return "";
  if (typeof value === "string") return value.trim();
  if (Array.isArray(value)) {
    const lines = value.map(storedLine).filter((line) => line !== "");
    return lines.length ? lines : "";
  }
  return value;
}

function storedLine(value) {
  if (isObject(value) && "text" in value && Object.keys(value).every((k) => TAGGED_LINE_KEYS.has(k))) {
    const text = typeof value.text === "string" ? storedValue(value.text) : value.text;
    const tags = Array.isArray(value.tags) ? storedValue(value.tags) : value.tags;
    return tags && text !== "" ? { text, tags } : text;
  }
  return typeof value === "string" ? storedValue(value) : value;
}

/** Deep equality of JSON values; the order of keys does not count. */
function sameValue(a, b) {
  if (Array.isArray(a) || Array.isArray(b)) {
    return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((x, i) => sameValue(x, b[i]));
  }
  if (isObject(a) || isObject(b)) {
    if (!isObject(a) || !isObject(b)) return false;
    const keys = Object.keys(a);
    return keys.length === Object.keys(b).length && keys.every((k) => Object.prototype.hasOwnProperty.call(b, k) && sameValue(a[k], b[k]));
  }
  return a === b;
}

/** The entries of a section as read from cv.yaml; one entry for a section that does not repeat. */
function loadedEntries(section, loaded) {
  const value = isObject(loaded) && section.cv ? loaded[section.id] : undefined;
  return (Array.isArray(value) ? value : [value]).filter(isObject);
}

function isLoadedEntry(section, track, item, before) {
  const ids = section.fields.filter((f) => applies(f, track) && f.cv !== false).map((f) => f.id);
  return before.some((entry) => ids.every((id) => sameValue(storedValue(item[id]), storedValue(entry[id]))));
}

function isLoadedValue(id, value, before) {
  const shown = storedValue(value);
  return shown !== "" && before.some((entry) => sameValue(storedValue(entry[id]), shown));
}

const loadedLines = (id, before) => before.flatMap((entry) => storedValue(entry[id]) || []);
const loadedCount = (id, before) => Math.max(0, ...before.map((entry) => (storedValue(entry[id]) || []).length));

function validateBundle(form, bundle, known, loaded) {
  const knownTags = new Set(Array.isArray(known) ? known : []);
  if (!isObject(bundle)) return [err("", "type")];
  if (bundle.format !== form.format) return [err("format", "bundle")];
  if (bundle.version !== form.version) return [err("version", "bundle")];
  const track = bundle.track;
  if (!isTrack(form, track)) return [err("track", "track")];
  const data = bundle.data;
  if (!isObject(data)) return [err("data", "type")];
  const errors = Object.keys(bundle).filter((k) => !TOP_LEVEL_KEYS.has(k)).map((k) => err(k, "unknown"));
  const sections = form.sections.filter((s) => applies(s, track));
  const ids = new Set(sections.map((s) => s.id));
  errors.push(...Object.keys(data).filter((k) => !ids.has(k)).map((k) => err(k, "unknown")));
  for (const section of sections) {
    const before = loadedEntries(section, loaded);
    errors.push(...validateSection(form, section, track, data[section.id], knownTags, before));
  }
  return errors;
}

function validateSection(form, section, track, value, known, before) {
  const sid = section.id;
  if (!section.repeat) {
    const item = value ?? {};
    return isObject(item) ? validateItem(form, section, track, item, sid, known, before) : [err(sid, "type")];
  }
  if (value == null) return [];
  if (!Array.isArray(value)) return [err(sid, "type")];
  const errors = [];
  if (value.length > Math.max(section.maxItems ?? form.limits.repeatItems, before.length)) errors.push(err(sid, "maxItems"));
  value.forEach((item, index) => {
    const path = `${sid}.${index}`;
    if (!isObject(item)) errors.push(err(path, "type"));
    else errors.push(...validateItem(form, section, track, item, path, known, before));
  });
  return errors;
}

function validateItem(form, section, track, item, path, known, before) {
  const fields = section.fields.filter((f) => applies(f, track));
  const ids = new Set(fields.map((f) => f.id));
  const errors = Object.keys(item).filter((k) => !ids.has(k)).map((k) => err(`${path}.${k}`, "unknown"));
  const same = isLoadedEntry(section, track, item, before);
  for (const field of fields) {
    if ((same && field.cv !== false) || isLoadedValue(field.id, item[field.id], before)) continue;
    errors.push(...validateField(form, field, track, item, `${path}.${field.id}`, known, before));
  }
  return errors;
}

function validateField(form, field, track, item, path, known, before) {
  const value = item[field.id];
  if (field.type === "tags") return validateTags(form, value, path, known);
  if (field.type === "list") return validateList(form, field, value, path, known, before);
  const text = value ?? "";
  if (typeof text !== "string") return [err(path, "type")];
  if (!text.trim()) return isRequired(field, item) ? [err(path, "required")] : [];
  const code = checkText(form, field, track, text);
  if (code) return [err(path, code)];
  if (field.notBefore && isBefore(text, item[field.notBefore])) return [err(path, "notBefore")];
  return [];
}

/** Required, unless the field named by requiredUnless holds text: a free text stands in for what it replaces (G25). */
function isRequired(field, item) {
  const other = field.requiredUnless === undefined ? undefined : item[field.requiredUnless];
  return Boolean(field.required) && !(typeof other === "string" && other.trim());
}

/** A list of tags: known ones may be longer or more than the limits allow, typed ones may not. */
function validateTags(form, value, path, known) {
  const list = value ?? [];
  if (!Array.isArray(list) || !list.every((v) => typeof v === "string")) return [err(path, "type")];
  const rules = tagRules(form);
  const tags = list.map((v) => v.trim()).filter((v) => v);
  const typed = tags.filter((tag) => !known.has(tag));
  const errors = tags.length > rules.maxItems && typed.length ? [err(path, "maxItems")] : [];
  list.forEach((tag, index) => {
    if (!tag.trim()) return;
    const code = checkText(form, known.has(tag.trim()) ? { ...rules, max: Infinity } : rules, null, tag);
    if (code) errors.push(err(`${path}.${index}`, code));
  });
  return errors;
}

/** A list of lines; lines cv.yaml holds in this field are not checked, two-language ones included. */
function validateList(form, field, value, path, known, before) {
  const list = value ?? [];
  if (!Array.isArray(list)) return [err(path, "type")];
  const tagged = field.tags === true;
  const lines = loadedLines(field.id, before);
  const inFile = list.map((v) => lines.some((line) => sameValue(line, storedLine(v))));
  const fits = (v, i) => inFile[i] || typeof v === "string" || (tagged && isTaggedLine(v));
  if (!list.every(fits)) return [err(path, "type")];
  const items = list.filter((v, i) => inFile[i] || lineOf(v).trim());
  if (!items.length) return field.required ? [err(path, "required")] : [];
  const errors = [];
  if (items.length > Math.max(field.maxItems ?? form.limits.listItems, loadedCount(field.id, before))) errors.push(err(path, "maxItems"));
  list.forEach((entry, index) => {
    const text = inFile[index] ? "" : lineOf(entry);
    if (!text.trim()) return;
    const code = checkText(form, field, null, text);
    if (code) errors.push(err(`${path}.${index}`, code));
    if (isObject(entry)) errors.push(...validateTags(form, entry.tags, `${path}.${index}.tags`, known));
  });
  return errors;
}

function checkText(form, field, track, value) {
  if (SINGLE_LINE.has(field.type) && /[\r\n]/.test(value)) return "newline";
  // Count code points like Python's len(), not UTF-16 units.
  if (Array.from(value).length > textLimit(form, field)) return "max";
  if (field.format && !new RegExp(form.formats[field.format].pattern).test(value.trim())) return "format";
  if (field.type === "select" && !field.options.includes(value)) return "option";
  if (field.type === "choice" && !field.allowOwn && !forTrack(field.options, track).includes(value)) return "option";
  return null;
}

function isBefore(end, start) {
  if (typeof start !== "string" || !start.trim()) return false;
  const e = end.trim();
  const s = start.trim();
  if (e.length === 4 || s.length === 4) return e.slice(0, 4) < s.slice(0, 4);
  return e < s;
}

function locate(form, track, path) {
  const parts = path ? path.split(".") : [];
  const section = form.sections.find((s) => parts.length && s.id === parts[0]);
  if (!section) return { where: "", field: null, section: null };
  const names = [forTrack(section.title, track) || section.id];
  let rest = parts.slice(1);
  if (section.repeat && rest.length && /^\d+$/.test(rest[0])) {
    names.push(`${forTrack(section.itemTitle, track)} ${Number(rest[0]) + 1}`);
    rest = rest.slice(1);
  }
  let field = section.fields.find((f) => rest.length && f.id === rest[0]) || null;
  if (field) {
    names.push((forTrack(field.label, track) || field.id).split(" (")[0]);
    const below = lineNames(rest.slice(1), field.type === "tags" ? TAG : LINE);
    names.push(...below.names);
    if (field.type === "tags" || below.inTags) field = tagRules(form);
  }
  return { where: names.join(", "), field, section };
}

/** Names below a field, the line ("Zeile 2") and on a line its tags ("Tags, Tag 1"); inTags if it reaches tags. */
function lineNames(rest, unit) {
  if (!rest.length || !/^\d+$/.test(rest[0])) return { names: [], inTags: false };
  const line = `${unit} ${Number(rest[0]) + 1}`;
  if (rest.length < 2 || rest[1] !== "tags") return { names: [line], inTags: false };
  return { names: [line, TAGS_NAME, ...lineNames(rest.slice(2, 3), TAG).names], inTags: true };
}

/** Message without location, for display next to the field. */
function messageText(form, track, error) {
  return describeParts(form, track, error).text;
}

/** Message with location (section, item, field), for summaries. */
function describe(form, track, error) {
  const { where, text } = describeParts(form, track, error);
  return where ? `${where}: ${text}` : text;
}

function describeParts(form, track, error) {
  const { where, field, section } = locate(form, track, error.path);
  const params = { max: "?", maxItems: "?", example: "?" };
  if (field) {
    params.max = textLimit(form, field);
    params.maxItems = field.maxItems ?? form.limits.listItems;
    if (field.format) params.example = form.formats[field.format].example;
  } else if (section) {
    params.maxItems = section.maxItems ?? form.limits.repeatItems;
  }
  const text = (MESSAGES[error.code] || error.code).replace(/\{(\w+)\}/g, (_, k) => params[k]);
  return { where, text };
}

if (typeof module !== "undefined") {
  module.exports = { validateBundle, describe, messageText, applies, forTrack, isTrack };
}

// Pure state handling of the onboarding template: no DOM, no storage.
// State: { track: "job" | "apprenticeship" | null, data: { [sectionId]: object | object[] } }.
// List fields hold arrays of lines; blank lines and empty items are dropped only when collecting.
// Tags (G24): a "tags" field holds an array of tags; a list marked "tags" holds lines as text or { text, tags }.
// What the form does not send stays in cv.yaml (G23): a missing tags key keeps the tags of the file, an empty list
// removes them. So tags go out wherever the page holds them, an empty list included; a plain text line keeps its tags.
// The same holds for sections and fields marked "keepUnlessGiven" in form.json (G25: projects, teaching, the website):
// they go out wherever the page holds them, empty too, and a state from before G25 sends no key, so cv.yaml keeps them.
// Two-language values {de, en} from cv.yaml (#167) stay as they are on text fields and as lines, and go back unchanged:
// validate.js lets them pass while cv.yaml holds them, and the app keeps them in the file until the person types anew.
"use strict";

/** A loaded file that is no bundle of this form; the message is German and shown as is. */
class BundleError extends Error {}

const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const LANGUAGES = ["de", "en"];

/** A two-language value as cv.yaml writes it: { de, en } with text in each. */
function isBilingual(value) {
  const keys = isPlainObject(value) ? Object.keys(value) : [];
  return keys.length > 0 && keys.every((k) => LANGUAGES.includes(k) && typeof value[k] === "string");
}

/** The two languages of a value or of a line ({ de, en } or { text: { de, en }, tags }); null for plain text. */
function bilingualOf(value) {
  if (isBilingual(value)) return value;
  return isPlainObject(value) && isBilingual(value.text) ? value.text : null;
}

function trackApplies(item, track) {
  return !item.tracks || item.tracks.includes(track);
}

/** Sections shown for a track, in form order. */
function sectionsFor(form, track) {
  return form.sections.filter((s) => trackApplies(s, track));
}

/** Fields of a section shown for a track. */
function fieldsFor(section, track) {
  return section.fields.filter((f) => trackApplies(f, track));
}

function linesToList(text) {
  return String(text).split(/\r?\n/);
}

function listToLines(list) {
  return Array.isArray(list) ? list.join("\n") : "";
}

/** Tags as typed: separated by commas, blanks dropped. */
function parseTags(text) {
  return String(text).split(",").map((t) => t.trim()).filter((t) => t);
}

function tagsToText(tags) {
  return Array.isArray(tags) ? tags.join(", ") : "";
}

function cleanTags(value, compact) {
  if (!Array.isArray(value)) return [];
  const tags = value.filter((t) => typeof t === "string").map((t) => (compact ? t.trim() : t));
  return compact ? tags.filter((t) => t) : tags;
}

/** One line of a list with tags: plain text (tags left to the file) or { text, tags }; null if it has no text. */
function cleanLine(value, compact) {
  if (typeof value === "string") return compact ? value.trim() : value;
  if (isBilingual(value)) return { ...value };
  if (isPlainObject(value) && isBilingual(value.text)) return { text: { ...value.text }, tags: cleanTags(value.tags, compact) };
  if (!isPlainObject(value) || typeof value.text !== "string") return null;
  return { text: compact ? value.text.trim() : value.text, tags: cleanTags(value.tags, compact) };
}

const lineText = (line) => (isPlainObject(line) ? (typeof line.text === "string" ? line.text : "") : String(line ?? ""));
/** True if a line or value holds something: text, or a value in two languages. */
const hasContent = (value) => Boolean(bilingualOf(value)) || lineText(value).trim() !== "";

/** A line the person edited: with its tags, an empty list included, so removing the last tag removes it. */
function taggedLine(text, tags) {
  return { text, tags };
}

function cleanList(field, value, compact) {
  if (field.tags === true) {
    const lines = value.map((v) => cleanLine(v, compact)).filter((v) => v !== null);
    return compact ? lines.filter(hasContent) : lines;
  }
  const lines = value.filter((v) => typeof v === "string").map((v) => (compact ? v.trim() : v));
  return compact ? lines.filter((v) => v) : lines;
}

/** Copy of an item with only known fields of the right type. */
function cleanItem(section, track, item, compact) {
  return pickFields(fieldsFor(section, track), item, compact);
}

function pickFields(fields, item, compact) {
  const result = {};
  if (!isPlainObject(item)) return result;
  for (const field of fields) {
    const value = item[field.id];
    if (field.type === "list" || field.type === "tags") {
      if (!Array.isArray(value)) continue;
      const kept = field.type === "tags" ? cleanTags(value, compact) : cleanList(field, value, compact);
      if (kept.length || field.type === "tags") result[field.id] = kept;
    } else if (typeof value === "string" && (!compact || value.trim() || field.keepUnlessGiven)) {
      result[field.id] = compact ? value.trim() : value;
    } else if (isBilingual(value)) {
      result[field.id] = { ...value };
    }
  }
  return result;
}

function cleanData(form, track, data, compact) {
  const result = {};
  for (const section of sectionsFor(form, track)) {
    const value = isPlainObject(data) ? data[section.id] : undefined;
    if (section.repeat) {
      if (!Array.isArray(value)) continue;
      const list = value.map((item) => cleanItem(section, track, item, compact));
      const kept = compact ? list.filter((item) => !isBlankItem(item)) : list;
      if (kept.length || section.keepUnlessGiven) result[section.id] = kept;
    } else if (isPlainObject(value)) {
      const item = cleanItem(section, track, value, compact);
      if (Object.keys(item).length) result[section.id] = item;
    }
  }
  return result;
}

/** The bundle written to einstieg.json: current track only, trimmed, without empty values. */
function collectBundle(form, state, now) {
  return {
    format: form.format,
    version: form.version,
    track: state.track,
    saved: now.toISOString(),
    data: cleanData(form, state.track, state.data, true),
  };
}

/** Bundle for live checks while typing: keeps item positions so error paths match the form. */
function draftBundle(form, state) {
  return { format: form.format, version: form.version, track: state.track, data: cleanData(form, state.track, state.data, false) };
}

/** True if a repeated item has no content yet (such items are dropped when saving); tags on an empty line do not count. */
function isBlankItem(item) {
  if (!isPlainObject(item)) return true;
  return Object.values(item).every((v) => (Array.isArray(v) ? !v.some(hasContent) : !hasContent(v)));
}

/** State from a loaded file; throws an Error with a German message if it is no bundle of this form. */
function stateFromBundle(form, bundle) {
  const ok = isPlainObject(bundle) && bundle.format === form.format && bundle.version === form.version
    && typeof bundle.track === "string" && Object.prototype.hasOwnProperty.call(form.tracks, bundle.track);
  if (!ok) throw new BundleError("Die Datei ist keine Einstiegsdatei dieser Vorlage.");
  return { track: bundle.track, data: cleanData(form, bundle.track, bundle.data, false) };
}

/** New state with the value at path (e.g. ["work", 0, "position"]) replaced; creates missing containers. */
function setValue(state, path, value) {
  const update = (container, keys) => {
    const [key, ...rest] = keys;
    const base = container ?? (typeof key === "number" ? [] : {});
    const copy = Array.isArray(base) ? [...base] : { ...base };
    copy[key] = rest.length ? update(base[key], rest) : value;
    return copy;
  };
  return { ...state, data: update(state.data, path) };
}

function addItem(state, sectionId) {
  const list = Array.isArray(state.data[sectionId]) ? state.data[sectionId] : [];
  return { ...state, data: { ...state.data, [sectionId]: [...list, {}] } };
}

function removeItem(state, sectionId, index) {
  const list = state.data[sectionId] || [];
  const next = { ...state, data: { ...state.data, [sectionId]: list.filter((_, i) => i !== index) } };
  return state.suggested ? { ...next, suggested: shiftSuggestions(state.suggested, sectionId, index) } : next;
}

// Suggestions from documents (page of the app): state.suggested = { "work.0": { file, place }, "style": { file, place } }.
// A mark says „not checked yet“. It stays while the person edits, because changing one value says nothing about
// the others in the entry; it goes when the person confirms the entry or removes it.

function confirmSuggestions(state, keys) {
  const marks = Object.entries(state.suggested || {}).filter(([key]) => !keys.includes(key));
  return { ...state, suggested: Object.fromEntries(marks) };
}

/** Marks that count now; those of sections in the other track stay, in case the person switches back. */
function uncheckedSuggestions(form, state) {
  const shown = new Set(sectionsFor(form, state.track).map((s) => s.id));
  return Object.keys(state.suggested || {}).filter((key) => shown.has(key.split(".")[0]));
}

function shiftSuggestions(marks, sectionId, removed) {
  const shifted = {};
  for (const [key, source] of Object.entries(marks)) {
    const [section, position] = key.split(".");
    const index = Number(position);
    if (section !== sectionId || position === undefined) shifted[key] = source;
    else if (index !== removed) shifted[`${section}.${index > removed ? index - 1 : index}`] = source;
  }
  return shifted;
}

const isBlankValue = (value) => (Array.isArray(value) ? !value.some(hasContent) : !hasContent(value));

/** Marks kept in a stored state; it comes from a file, so only what has the expected shape stays. */
function cleanSuggestions(marks) {
  if (!isPlainObject(marks)) return {};
  const valid = ([, s]) => isPlainObject(s) && typeof s.file === "string" && typeof s.place === "string";
  return Object.fromEntries(Object.entries(marks).filter(valid).map(([key, s]) => [key, { file: s.file, place: s.place }]));
}

function suggestRepeated(data, marks, section, found) {
  const current = Array.isArray(data[section.id]) ? data[section.id] : [];
  if (!current.every(isBlankItem)) return null;
  const kept = Object.entries(marks).filter(([key]) => !key.startsWith(`${section.id}.`));
  const added = found.map((entry, index) => [`${section.id}.${index}`, entry.source]);
  return { data: { ...data, [section.id]: found.map((entry) => entry.values) }, marks: Object.fromEntries([...kept, ...added]) };
}

function suggestSingle(data, marks, section, found) {
  const current = isPlainObject(data[section.id]) ? data[section.id] : {};
  const free = Object.entries(found.values).filter(([key]) => isBlankValue(current[key]));
  if (!free.length) return null;
  return { data: { ...data, [section.id]: { ...current, ...Object.fromEntries(free) } }, marks: { ...marks, [section.id]: found.source } };
}

/**
 * New state with the suggestions in empty places only: what the person has written always stays.
 * Returns { state, filled, kept } with section ids: where suggestions went, and where they did not.
 */
function applySuggestions(form, state, suggestions) {
  let result = { data: state.data, marks: state.suggested || {} };
  const filled = [];
  const kept = [];
  for (const section of sectionsFor(form, state.track)) {
    const found = suggestions[section.id];
    if (!found) continue;
    const merged = (section.repeat ? suggestRepeated : suggestSingle)(result.data, result.marks, section, found);
    (merged ? filled : kept).push(section.id);
    result = merged || result;
  }
  return { state: { ...state, data: result.data, suggested: result.marks }, filled, kept };
}

// The page of the app opens on the CV in the data folder (G23): the app reads cv.yaml (onboarding/cv_read.py), and the
// sections marked "cv" in form.json follow it. A field marked "cv": false is not in the file; it stays on its entry.

const cvFields = (section) => section.fields.filter((f) => f.cv !== false);

const comparableLine = (v) => (isPlainObject(v) ? { text: lineText(v).trim(), tags: cleanTags(v.tags, true) } : String(v).trim());
const comparable = (value) => (Array.isArray(value) ? value.map(comparableLine).filter((v) => lineText(v)) : String(value ?? "").trim());

function sameInCv(section, a, b) {
  return cvFields(section).every((f) => JSON.stringify(comparable(a[f.id])) === JSON.stringify(comparable(b[f.id])));
}

/** Entries from the CV with the fields only the form holds, taken from the stored entry that matches. */
function withFormFields(section, entries, stored) {
  const own = section.fields.filter((f) => f.cv === false);
  const previous = Array.isArray(stored) ? stored.filter(isPlainObject) : [];
  if (!own.length || !previous.length) return entries;
  const used = new Set();
  return entries.map((entry) => {
    const match = previous.findIndex((item, index) => !used.has(index) && sameInCv(section, item, entry));
    if (match < 0) return entry;
    used.add(match);
    return { ...entry, ...pickFields(own, previous[match], false) };
  });
}

/** New state with the CV sections taken from the answers the app read from cv.yaml; unchanged without them. */
function fillFromCv(form, state, cv) {
  if (!isPlainObject(cv)) return state;
  const sections = form.sections.filter((s) => s.cv);
  const data = { ...state.data };
  for (const section of sections) {
    const value = cv[section.id];
    if (section.repeat) {
      const entries = (Array.isArray(value) ? value : []).map((item) => pickFields(cvFields(section), item, true))
        .filter((item) => Object.keys(item).length);
      data[section.id] = withFormFields(section, entries, state.data[section.id]);
    } else {
      data[section.id] = pickFields(cvFields(section), value, true);
    }
  }
  if (!state.suggested) return { ...state, data };
  const filled = new Set(sections.map((s) => s.id));
  const marks = Object.entries(state.suggested).filter(([key]) => !filled.has(key.split(".")[0]));
  return { ...state, data, suggested: Object.fromEntries(marks) };
}

// Suggestions for tags: those the app found in the data folder (cv.yaml, varianten.yaml, jobs/) and those typed here.

const TAG_ORDER = (a, b) => a.toLowerCase().localeCompare(b.toLowerCase(), "de") || (a < b ? -1 : a > b ? 1 : 0);

function tagsOfItem(section, item) {
  if (!isPlainObject(item)) return [];
  return section.fields.flatMap((field) => {
    const value = item[field.id];
    if (!Array.isArray(value)) return [];
    if (field.type === "tags") return cleanTags(value, true);
    return field.tags === true ? value.flatMap((line) => (isPlainObject(line) ? cleanTags(line.tags, true) : [])) : [];
  });
}

/** Every tag the form can show once (format "tag"; long ones too), sorted without regard to case. */
function knownTags(form, state, fromApp) {
  const pattern = new RegExp(form.formats.tag.pattern);
  const valid = (t) => t !== "" && pattern.test(t);
  const typed = form.sections.filter((s) => s.repeat && Array.isArray(state.data[s.id]))
    .flatMap((s) => state.data[s.id].flatMap((item) => tagsOfItem(s, item)));
  const all = [...(Array.isArray(fromApp) ? fromApp : []), ...typed]
    .filter((t) => typeof t === "string").map((t) => t.trim()).filter(valid);
  return [...new Set(all)].sort(TAG_ORDER);
}

if (typeof module !== "undefined") {
  module.exports = {
    sectionsFor, fieldsFor, linesToList, listToLines, parseTags, tagsToText, taggedLine, lineText, knownTags, isBilingual, bilingualOf,
    collectBundle, draftBundle, isBlankItem, stateFromBundle,
    setValue, addItem, removeItem, applySuggestions, fillFromCv, cleanSuggestions, confirmSuggestions, uncheckedSuggestions, BundleError,
  };
}

// The steps of the template (MIN-369): the sections of form.json grouped into five steps, as in the design.
// Pure data and lookups, no DOM; tested in tests/steps.test.cjs.
"use strict";

/** Sections per step, in the order shown; a section that does not apply to the track is left out. */
const STEP_GROUPS = [
  {
    id: "person",
    title: { job: "Person und Kontakt", apprenticeship: "Du und deine Kontakte" },
    meta: { job: "Name, Adresse, Kontakt", apprenticeship: "Name, Adresse, Kontakt" },
    sections: { job: ["person"], apprenticeship: ["person"] },
  },
  {
    id: "career",
    title: { job: "Werdegang", apprenticeship: "Schule und Schnuppern" },
    meta: { job: "Stationen, Lehre, Projekte, Ausbildung, Kurse", apprenticeship: "Schule, Schnupperlehren, Tests" },
    sections: { job: ["work", "teaching", "projects", "education", "certificates"], apprenticeship: ["education", "work", "certificates"] },
  },
  {
    id: "abilities",
    title: { job: "Können", apprenticeship: "Was du kannst" },
    meta: { job: "Sprachen, Kenntnisse, Stärken", apprenticeship: "Sprachen, Stärken, Hobbys" },
    sections: { job: ["languages", "skills", "strengths", "interests"], apprenticeship: ["languages", "skills", "strengths", "interests"] },
  },
  {
    id: "search",
    title: { job: "Was Sie suchen", apprenticeship: "Was du suchst" },
    meta: { job: "Stellen, Region, Rahmen", apprenticeship: "Berufe, Region, Lehrbeginn" },
    sections: { job: ["searchJob", "frame"], apprenticeship: ["searchApprenticeship", "frame"] },
  },
  {
    id: "writing",
    title: { job: "Wie Sie schreiben", apprenticeship: "Wie du schreibst" },
    meta: { job: "Kurzprofil, Lücken, Ton", apprenticeship: "Lücken, Ton" },
    sections: { job: ["summary", "gaps", "style"], apprenticeship: ["gaps", "style"] },
  },
];

/** The five steps for a track: { id, title, meta, sections }; `sections` are those of the track (model.sectionsFor). */
function stepGroups(sections, track) {
  const byId = new Map(sections.map((s) => [s.id, s]));
  return STEP_GROUPS.map((group) => ({
    id: group.id,
    title: group.title[track],
    meta: group.meta[track],
    sections: group.sections[track].map((id) => byId.get(id)).filter(Boolean),
  }));
}

/** Index of the group that holds a section, -1 if none does. */
function groupOfSection(groups, sectionId) {
  return groups.findIndex((g) => g.sections.some((s) => s.id === sectionId));
}

if (typeof module !== "undefined") {
  module.exports = { STEP_GROUPS, stepGroups, groupOfSection };
}

// DOM building blocks of the template. Values from the person or a loaded file are only ever set as
// text or form values, never as HTML.
"use strict";

const MAX_TAG_OPTIONS = 50;
const DEFAULT_MAX_LINES = 20;
const TAG_PLACEHOLDER = "z.B. daten, führung";
const LANGUAGE_NAMES = { de: "Deutsch", en: "Englisch" };
const BILINGUAL_TEXT = {
  lead: "Zweisprachig, hier nicht änderbar:",
  where: "Beide Sprachen lassen sich unter „Inhalte als Text“ (Menü „Mehr“) ändern.",
  field: "Eine Eingabe hier ersetzt beide.",
  line: "Eine Eingabe in der Zeile ersetzt beide.",
};

/** Create an element; attrs are properties (on* handlers, dataset, aria via setAttribute). */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "dataset") Object.assign(node.dataset, value);
    else if (key.startsWith("aria-") || key === "role" || key === "for" || key === "list") node.setAttribute(key, value);
    else node[key] = value;
  }
  for (const child of [].concat(children || [])) {
    if (child === null || child === undefined || child === false) continue;
    node.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

let idCounter = 0;
const nextId = (prefix) => `${prefix}-${++idCounter}`;

/** The note under a value from cv.yaml in two languages (#167): both shown, edited elsewhere, replaced by typing. */
function bilingualNote(value, replacing) {
  const languages = Object.entries(value).map(([key, text]) => `${LANGUAGE_NAMES[key] || key} „${text.trim()}“`).join(", ");
  return el("p", { className: "hint bilingual" }, `${BILINGUAL_TEXT.lead} ${languages}. ${BILINGUAL_TEXT.where} ${replacing}`);
}

/**
 * A text control on a value that may come in two languages: it starts empty then, and emptying it again keeps the
 * two languages, so only typing replaces them.
 */
function textInput(tag, attrs, ctx) {
  const original = isBilingual(ctx.value) ? ctx.value : null;
  const input = el(tag, {
    ...attrs, value: original ? "" : ctx.value || "", oninput: (e) => ctx.onChange(original && e.target.value === "" ? original : e.target.value),
  });
  return original ? [input, bilingualNote(original, BILINGUAL_TEXT.field)] : input;
}

/**
 * One field with label, hint, control and error slot.
 * ctx: { track, value, path (string), tagSuggestions (tags offered while typing), onChange(value), onBlur() }
 */
function fieldView(field, ctx) {
  const id = nextId("f");
  const hint = forTrack(field.hint, ctx.track);
  const hintId = hint ? `${id}-hint` : null;
  const errorId = `${id}-error`;
  const describedBy = [hintId, errorId].filter(Boolean).join(" ");
  const label = forTrack(field.label, ctx.track) + (field.required ? " *" : "");
  const control = controlView(field, ctx, id, describedBy);
  const isCantons = field.control === "cantons";
  const isGroup = field.type === "choice" || isCantons;
  return el("div", { className: `field field-${field.type}`, dataset: { path: ctx.path } }, [
    isGroup ? null : el("label", { for: id }, label),
    isGroup ? null : hint ? el("p", { className: "hint", id: hintId }, hint) : null,
    ...[].concat(isCantons ? cantonsView(field, ctx, label, hint, hintId, errorId)
      : isGroup ? choiceView(field, ctx, id, label, hint, hintId, errorId) : control),
    el("p", { className: "error", id: errorId, role: "alert" }),
  ]);
}

function controlView(field, ctx, id, describedBy) {
  if (field.control === "cantons") return null;
  const common = { id, "aria-describedby": describedBy, "aria-required": field.required ? "true" : null, onblur: () => ctx.onBlur() };
  if (field.type === "textarea") return textInput("textarea", { ...common, rows: 4 }, ctx);
  if (field.type === "tags") {
    const onTags = (tags) => ctx.onChange(tags);
    return el("div", { className: "tags-control" }, tagsInput({ ...common, placeholder: TAG_PLACEHOLDER }, ctx.value, ctx.tagSuggestions, onTags));
  }
  if (field.type === "list" && field.tags === true) return taggedLinesView(field, ctx, id, describedBy);
  if (field.type === "list") {
    const text = listToLines(ctx.value);
    return el("textarea", {
      ...common, rows: Math.max(3, text.split("\n").length + 1), value: text,
      placeholder: "Eine Angabe pro Zeile", oninput: (e) => ctx.onChange(linesToList(e.target.value)),
    });
  }
  if (field.type === "select") {
    // a value from cv.yaml outside the options is shown as it is and stays until the person picks another (#167)
    const own = typeof ctx.value === "string" && ctx.value !== "" && !field.options.includes(ctx.value) ? [ctx.value] : [];
    const select = el("select", { ...common, onchange: (e) => ctx.onChange(e.target.value) }, [
      el("option", { value: "" }, "– bitte wählen –"),
      ...[...field.options, ...own].map((o) => el("option", { value: o, selected: o === ctx.value }, field.optionLabels?.[o] ?? o)),
    ]);
    return select;
  }
  if (field.type === "choice") return null;
  const type = field.format === "email" ? "email" : field.format === "phone" ? "tel" : "text";
  return textInput("input", { ...common, type, placeholder: field.placeholder || "", autocomplete: autocompleteFor(ctx.path) }, ctx);
}

/**
 * What the list of a tags input offers: the last tag completed, or another tag after a complete one. A datalist
 * matches the whole text of the input, so each option is the whole text with the tag in it.
 */
function tagOptions(text, suggestions) {
  const offered = Array.isArray(suggestions) ? suggestions : [];
  const parts = String(text).split(",");
  const done = parts.slice(0, -1).map((t) => t.trim()).filter((t) => t);
  const last = parts[parts.length - 1].trim();
  const free = offered.filter((t) => t !== last && !done.includes(t));
  const completed = free.filter((t) => t.toLowerCase().startsWith(last.toLowerCase())).map((t) => [...done, t].join(", "));
  const added = offered.includes(last) ? free.map((t) => [...done, last, t].join(", ")) : [];
  return [...new Set([...completed, ...added])].slice(0, MAX_TAG_OPTIONS);
}

/** A text input for tags separated by commas, with its own list of suggestions; onTags gets the tags. */
function tagsInput(attrs, tags, suggestions, onTags) {
  const listId = nextId("tags");
  const datalist = el("datalist", { id: listId });
  const offer = (text) => datalist.replaceChildren(...tagOptions(text, suggestions).map((o) => el("option", { value: o })));
  const text = tagsToText(tags);
  offer(text);
  const input = el("input", {
    ...attrs, type: "text", value: text, list: listId, autocomplete: "off", spellcheck: false,
    oninput: (e) => { offer(e.target.value); onTags(parseTags(e.target.value)); },
  });
  return [input, datalist];
}

/** A list whose lines take tags (highlights): one row per line with its text and its tags. */
function taggedLinesView(field, ctx, id, describedBy) {
  const name = forTrack(field.label, ctx.track).split(" (")[0];
  const max = field.maxItems ?? DEFAULT_MAX_LINES;
  let lines = Array.isArray(ctx.value) && ctx.value.length ? ctx.value : [""];
  const rows = el("div", { className: "tagged-lines" });
  const view = el("div", { className: "tagged-list" });
  const tagsOf = (line) => (line !== null && typeof line === "object" && Array.isArray(line.tags) ? line.tags : []);
  const change = (next, focusAt) => {
    lines = next.length ? next : [""];
    ctx.onChange(lines);
    if (focusAt !== undefined) draw(focusAt);
  };
  const setLine = (index, text, tags) => change(lines.map((line, i) => (i === index ? taggedLine(text, tags) : line)));
  const add = el("button", {
    type: "button", className: "add-line", onclick: () => change([...lines, ""], lines.length),
  }, "+ Zeile hinzufügen");

  // a line in two languages (#167) starts empty and keeps its tags until the person types a new text
  function row(line, index) {
    const number = index + 1;
    const original = bilingualOf(line);
    const text = el("input", {
      type: "text", id: index === 0 ? id : null, value: original ? "" : lineText(line), "aria-label": `${name}, Zeile ${number}`,
      "aria-describedby": describedBy, onblur: () => ctx.onBlur(),
      oninput: (e) => setLine(index, e.target.value, tagsOf(lines[index])),
    });
    const tagAttrs = { className: "line-tags", placeholder: "Tags", "aria-label": `Tags zu Zeile ${number}`, onblur: () => ctx.onBlur(), disabled: Boolean(original) };
    const tags = tagsInput(tagAttrs, tagsOf(line), ctx.tagSuggestions, (found) => setLine(index, lineText(lines[index]), found));
    const remove = el("button", {
      type: "button", className: "remove-line", "aria-label": `Zeile ${number} entfernen`,
      onclick: () => change(lines.filter((_, i) => i !== index), Math.max(0, index - 1)),
    }, "×");
    return el("div", { className: "tagged-line" }, [text, ...tags, remove, original ? bilingualNote(original, BILINGUAL_TEXT.line) : null]);
  }

  function draw(focusAt) {
    rows.replaceChildren(...lines.map(row));
    view.replaceChildren(rows, ...(lines.length < max ? [add] : []));
    const target = focusAt === undefined ? null : rows.children[Math.min(focusAt, lines.length - 1)];
    if (target) target.children[0].focus();
  }

  draw();
  return view;
}

function autocompleteFor(path) {
  const map = { "person.name": "name", "person.email": "email", "person.phone": "tel", "person.address": "street-address",
    "person.postalCode": "postal-code", "person.city": "address-level2" };
  return map[path] || "off";
}

/** Radio group of suggested texts plus an own formulation. */
/** Names instead of codes: the answer stays the list of codes the search and the checks know. */
function cantonsView(field, ctx, label, hint, hintId, errorId) {
  const chosen = new Set(ctx.value || []);
  const changed = (e) => {
    const boxes = e.target.closest(".canton-list").querySelectorAll("input:checked");
    ctx.onChange([...boxes].map((box) => box.value));
  };
  return el("fieldset", { className: "choice cantons", "aria-describedby": [hintId, errorId].filter(Boolean).join(" ") }, [
    el("legend", {}, label),
    hint ? el("p", { className: "hint", id: hintId }, hint) : null,
    el("div", { className: "canton-list" }, ctx.cantons.map((canton) => el("label", { className: "option" }, [
      el("input", {
        type: "checkbox", value: canton.code, checked: chosen.has(canton.code),
        onchange: changed, onblur: () => ctx.onBlur(),
      }),
      el("span", {}, canton.name),
    ]))),
  ]);
}

function choiceView(field, ctx, id, label, hint, hintId, errorId) {
  const options = forTrack(field.options, ctx.track) || [];
  const value = ctx.value || "";
  const isOwn = value !== "" && !options.includes(value);
  const ownInput = el("input", {
    type: "text", value: isOwn ? value : "", className: "own", "aria-label": "Eigene Formulierung",
    oninput: (e) => { ownRadio.checked = true; ctx.onChange(e.target.value); }, onblur: () => ctx.onBlur(),
  });
  const ownRadio = el("input", {
    type: "radio", name: id, checked: isOwn,
    onchange: () => { ownInput.focus(); ctx.onChange(ownInput.value); },
  });
  const radios = options.map((option) => el("label", { className: "option" }, [
    el("input", { type: "radio", name: id, value: option, checked: option === value, onchange: () => ctx.onChange(option), onblur: () => ctx.onBlur() }),
    el("span", {}, option),
  ]));
  return el("fieldset", {
    className: "choice", role: "radiogroup", "aria-required": field.required ? "true" : null,
    "aria-describedby": [hintId, errorId].filter(Boolean).join(" "),
  }, [
    el("legend", {}, label),
    hint ? el("p", { className: "hint", id: hintId }, hint) : null,
    ...radios,
    field.allowOwn ? el("label", { className: "option own-option" }, [ownRadio, el("span", {}, "Eigene Formulierung:"), ownInput]) : null,
  ]);
}

/** Show the given messages in the error slots of the rendered fields (matching path or sub-paths). */
function showErrors(root, messagesByPath, visiblePaths) {
  for (const node of root.querySelectorAll(".field[data-path]")) {
    const path = node.dataset.path;
    const own = Object.entries(messagesByPath)
      .filter(([p]) => p === path || p.startsWith(`${path}.`))
      .map(([, m]) => m);
    const visible = visiblePaths.has(path) && own.length > 0;
    node.querySelector(".error").textContent = visible ? own.join(" ") : "";
    node.classList.toggle("invalid", visible);
    for (const control of node.querySelectorAll("input, textarea, select")) {
      if (visible) control.setAttribute("aria-invalid", "true");
      else control.removeAttribute("aria-invalid");
    }
  }
}

if (typeof module !== "undefined") {
  module.exports = { el, fieldView, showErrors };
}

// Rules for uploaded documents, for the browser. Mirrors documents.py; both run the shared
// "documentCases" in tests/cases.json. An entry is { category, name, size }.
"use strict";

const BYTES_PER_MB = 1000000;
const MAX_NAME_CHARS = 120;
const FALLBACK_NAME = "unterlage";
const DOCUMENT_MESSAGES = {
  type: "Unerwarteter Eintrag.",
  category: "Unbekannte Art von Unterlage.",
  name: "Ungültiger Dateiname.",
  extension: "Dieser Dateityp geht nicht. Erlaubt sind {allowed}.",
  size: "Die Datei ist zu gross (höchstens {maxFileMB} MB).",
  duplicate: "Diese Datei ist schon dabei.",
  maxFiles: "Zu viele Dateien (höchstens {maxFiles}).",
  leftOutOne: "{title}: höchstens {maxFiles} Dateien. Eine Datei wurde nicht hinzugefügt.",
  leftOutMany: "{title}: höchstens {maxFiles} Dateien. {count} Dateien wurden nicht hinzugefügt.",
  total: "Zusammen sind die Dateien zu gross (höchstens {maxTotalMB} MB).",
};

const titleForTrack = (value, track) => (value !== null && typeof value === "object" ? value[track] : value);
const isDocumentObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const isSize = (v) => typeof v === "number" && Number.isInteger(v) && v > 0;

function documentCategories(form) {
  return new Map(form.documents.categories.map((c) => [c.id, c]));
}

function documentExtension(name) {
  const dot = name.lastIndexOf(".");
  return dot < 0 ? "" : name.slice(dot + 1).toLowerCase();
}

/** File extensions a category accepts, from its file types (e.g. images only for certificates). */
function allowedExtensions(form, category) {
  const types = form.documents.fileTypes;
  return category.fileTypes.flatMap((t) => types[t].extensions);
}

/** German list of the accepted file types, e.g. „PDF, Word (.docx, .doc) und Textdateien (.txt)“. */
function allowedText(form, category) {
  const types = form.documents.fileTypes;
  const labels = category.fileTypes.flatMap((t) => types[t].labels);
  return labels.length === 1 ? labels[0] : `${labels.slice(0, -1).join(", ")} und ${labels[labels.length - 1]}`;
}

function validateDocuments(form, entries) {
  if (!Array.isArray(entries)) return [{ path: "documents", code: "type" }];
  const rules = form.documents;
  const known = documentCategories(form);
  const errors = [];
  const seen = new Set();
  const counts = new Map();
  let total = 0;
  entries.forEach((entry, index) => {
    const code = documentEntryError(form, known, entry, seen);
    if (code) errors.push({ path: `documents.${index}`, code });
    if (isDocumentObject(entry) && typeof entry.category === "string" && known.has(entry.category)) {
      counts.set(entry.category, (counts.get(entry.category) || 0) + 1);
    }
    if (isDocumentObject(entry) && isSize(entry.size)) total += entry.size;
  });
  for (const [id, count] of counts) {
    if (count > known.get(id).maxFiles) errors.push({ path: `documents.${id}`, code: "maxFiles" });
  }
  if (total > rules.maxTotalBytes) errors.push({ path: "documents", code: "total" });
  return errors;
}

function documentEntryError(form, known, entry, seen) {
  const rules = form.documents;
  if (!isDocumentObject(entry)) return "type";
  const { category, name, size } = entry;
  if (typeof category !== "string" || !known.has(category)) return "category";
  if (typeof name !== "string" || !new RegExp(rules.namePattern, "u").test(name)) return "name";
  if (!allowedExtensions(form, known.get(category)).includes(documentExtension(name))) return "extension";
  if (!isSize(size) || size > rules.maxFileBytes) return "size";
  const key = `${category}/${name.toLowerCase()}`;
  if (seen.has(key)) return "duplicate";
  seen.add(key);
  return null;
}

/** German message: category and file name, then what is wrong. */
function describeDocument(form, track, entries, error) {
  const rules = form.documents;
  const known = documentCategories(form);
  const parts = error.path.split(".");
  const params = {
    maxFileMB: Math.floor(rules.maxFileBytes / BYTES_PER_MB),
    maxTotalMB: Math.floor(rules.maxTotalBytes / BYTES_PER_MB),
    maxFiles: "?",
    allowed: "?",
  };
  let where = "";
  if (parts.length === 2 && known.has(parts[1])) {
    const category = known.get(parts[1]);
    params.maxFiles = category.maxFiles;
    where = titleForTrack(category.title, track);
  } else if (parts.length === 2 && /^[0-9]+$/.test(parts[1]) && Number(parts[1]) < entries.length) {
    const entry = entries[Number(parts[1])];
    if (isDocumentObject(entry)) {
      const category = typeof entry.category === "string" ? known.get(entry.category) : undefined;
      if (category) params.allowed = allowedText(form, category);
      where = [category ? titleForTrack(category.title, track) : "", entry.name]
        .filter((n) => typeof n === "string" && n).join(", ");
    }
  }
  const text = (DOCUMENT_MESSAGES[error.code] || error.code).replace(/\{(\w+)\}/g, (_, k) => params[k]);
  return where ? `${where}: ${text}` : text;
}

/** A file name from the person's computer, made safe: no folders, no special characters, at most 120 characters. */
function safeDocumentName(raw) {
  const base = String(raw).normalize("NFC").split(/[\\/]/).pop();
  let name = base.replace(/[:*?"<>|\u0000-\u001f\u007f]/g, "-").replace(/^[.\s]+/, "").replace(/[.\s]+$/, "");
  if (!/[^\-.\s]/.test(name)) return FALLBACK_NAME;
  const chars = Array.from(name);
  if (chars.length <= MAX_NAME_CHARS) return name;
  const ext = documentExtension(name);
  const suffix = ext && ext.length < 10 ? `.${ext}` : "";
  return chars.slice(0, MAX_NAME_CHARS - suffix.length).join("").replace(/[.\s]+$/, "") + suffix;
}

// Uploads in the template: which chosen files to take, and the ZIP layout shared with archive.py.

const UPLOAD_BUNDLE = "einstieg.json";
const UPLOAD_DIR = "dokumente";

/** A ZIP that is no file of this template; the message is German and shown as is. */
class UploadError extends Error {}

/** How many files of a category are there and how many it takes. */
function categoryRoom(form, uploads, category) {
  const { maxFiles } = documentCategories(form).get(category);
  return { count: uploads.filter((u) => u.category === category).length, maxFiles };
}

/**
 * Which of the chosen files (each { name, size }) to add to a category, checked against the rules
 * together with what is already there. Files beyond the limit of the category are left out and counted in
 * one message, so the list and the message agree. Returns { accepted: [{ index, category, name, size }], messages }.
 */
function planUploads(form, track, current, category, chosen) {
  const accepted = [];
  const messages = [];
  let leftOut = 0;
  chosen.forEach((file, index) => {
    const entry = { category, name: safeDocumentName(file.name), size: file.size };
    const entries = [...current, ...accepted, entry].map(({ category: c, name, size }) => ({ category: c, name, size }));
    const [error] = validateDocuments(form, entries).filter((e) => isAbout(e, entries.length - 1, category));
    if (error && error.code === "maxFiles") leftOut += 1;
    else if (error) messages.push(describeDocument(form, track, entries, error)); // one message per file is enough
    else accepted.push({ index, ...entry });
  });
  return { accepted, messages: leftOut ? [...messages, leftOutMessage(form, track, category, leftOut)] : messages };
}

function leftOutMessage(form, track, category, count) {
  const rules = documentCategories(form).get(category);
  const params = { title: titleForTrack(rules.title, track), maxFiles: rules.maxFiles, count };
  const text = count === 1 ? DOCUMENT_MESSAGES.leftOutOne : DOCUMENT_MESSAGES.leftOutMany;
  return text.replace(/\{(\w+)\}/g, (_, k) => params[k]);
}

function isAbout(error, last, category) {
  return error.path === `documents.${last}` || error.path === `documents.${category}` || error.path === "documents";
}

/** ZIP entries for the saved file: the answers plus each upload under dokumente/<category>/<name>. */
function uploadZipEntries(bundleBytes, uploads) {
  return [
    { name: UPLOAD_BUNDLE, data: bundleBytes },
    ...uploads.map((u) => ({ name: `${UPLOAD_DIR}/${u.category}/${u.name}`, data: u.data })),
  ];
}

/** Split the entries of a loaded ZIP into the answers (bytes) and uploads; throws UploadError. */
function splitUploadZip(form, entries) {
  const bundles = entries.filter((e) => e.name === UPLOAD_BUNDLE);
  if (bundles.length !== 1) throw new UploadError(`Die Datei muss genau eine ${UPLOAD_BUNDLE} enthalten.`);
  const uploads = entries.filter((e) => e.name !== UPLOAD_BUNDLE).map((e) => {
    const parts = e.name.split("/");
    if (parts.length !== 3 || parts[0] !== UPLOAD_DIR) throw new UploadError(`Unerwarteter Inhalt in der Datei: ${e.name}`);
    return { category: parts[1], name: parts[2], size: e.data.length, data: e.data };
  });
  const [error] = validateDocuments(form, uploads.map(({ category, name, size }) => ({ category, name, size })));
  if (error) throw new UploadError(describeDocument(form, "job", uploads, error));
  return { bundle: bundles[0].data, uploads };
}

/** Most entries a saved ZIP can have: the answers plus the most files of every category. */
function maxUploadEntries(form) {
  return 1 + form.documents.categories.reduce((sum, c) => sum + c.maxFiles, 0);
}

if (typeof module !== "undefined") {
  module.exports = {
    validateDocuments, describeDocument, safeDocumentName, documentCategories, documentExtension, allowedExtensions, allowedText,
    planUploads, categoryRoom, uploadZipEntries, splitUploadZip, maxUploadEntries, UploadError,
  };
}

// Minimal ZIP writer and reader for the template: einstieg.json plus uploaded documents in one file.
// Writes stored or deflated entries with UTF-8 names; reads stored and deflated entries, checks sizes
// and CRCs and stops at the given limits. No encryption, no ZIP64, no multi-disk archives.
"use strict";

const SIG_LOCAL = 0x04034b50;
const SIG_CENTRAL = 0x02014b50;
const SIG_END = 0x06054b50;
const LOCAL_HEADER = 30;
const CENTRAL_HEADER = 46;
const END_RECORD = 22;
const MAX_COMMENT = 0xffff;
const FLAG_ENCRYPTED = 0x0001;
const FLAG_UTF8 = 0x0800;
const METHOD_STORED = 0;
const METHOD_DEFLATE = 8;
const ZIP_VERSION = 20;

class ZipError extends Error {}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(data) {
  let crc = 0xffffffff;
  for (let i = 0; i < data.length; i++) crc = CRC_TABLE[(crc ^ data[i]) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

async function streamThrough(data, transform, limit) {
  const reader = new Blob([data]).stream().pipeThrough(transform).getReader();
  const chunks = [];
  let length = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    length += value.length;
    if (limit !== undefined && length > limit) {
      await reader.cancel();
      throw new ZipError("Die Datei ist beschädigt (ein Eintrag ist grösser als angegeben).");
    }
    chunks.push(value);
  }
  const out = new Uint8Array(length);
  let offset = 0;
  for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.length; }
  return out;
}

function dosDateTime(date) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
  const day = ((Math.max(date.getFullYear(), 1980) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  return { time, day };
}

/** ZIP bytes for entries [{ name, data: Uint8Array }]; with compress, entries are deflated where that is smaller. */
async function createZip(entries, { date = new Date(), compress = false } = {}) {
  const { time, day } = dosDateTime(date);
  const encoder = new TextEncoder();
  const locals = [];
  const centrals = [];
  let offset = 0;
  for (const entry of entries) {
    const name = encoder.encode(entry.name);
    const crc = crc32(entry.data);
    let method = METHOD_STORED;
    let body = entry.data;
    if (compress) {
      const deflated = await streamThrough(entry.data, new CompressionStream("deflate-raw"));
      if (deflated.length < entry.data.length) { method = METHOD_DEFLATE; body = deflated; }
    }
    const fields = { method, time, day, crc, compressed: body.length, size: entry.data.length, name };
    const local = header(LOCAL_HEADER, SIG_LOCAL, fields);
    locals.push(local, body);
    centrals.push(header(CENTRAL_HEADER, SIG_CENTRAL, fields, offset));
    offset += local.length + body.length;
  }
  const centralSize = centrals.reduce((sum, c) => sum + c.length, 0);
  const end = new Uint8Array(END_RECORD);
  const view = new DataView(end.buffer);
  view.setUint32(0, SIG_END, true);
  view.setUint16(8, entries.length, true);
  view.setUint16(10, entries.length, true);
  view.setUint32(12, centralSize, true);
  view.setUint32(16, offset, true);
  return concat([...locals, ...centrals, end]);
}

function header(size, signature, f, offset) {
  const out = new Uint8Array(size + f.name.length);
  const v = new DataView(out.buffer);
  v.setUint32(0, signature, true);
  const central = signature === SIG_CENTRAL;
  const base = central ? 2 : 0; // the central header has "version made by" before the common fields
  if (central) v.setUint16(4, ZIP_VERSION, true);
  v.setUint16(4 + base, ZIP_VERSION, true);
  v.setUint16(6 + base, FLAG_UTF8, true);
  v.setUint16(8 + base, f.method, true);
  v.setUint16(10 + base, f.time, true);
  v.setUint16(12 + base, f.day, true);
  v.setUint32(14 + base, f.crc, true);
  v.setUint32(18 + base, f.compressed, true);
  v.setUint32(22 + base, f.size, true);
  v.setUint16(26 + base, f.name.length, true);
  if (central) v.setUint32(42, offset, true);
  out.set(f.name, size);
  return out;
}

function concat(parts) {
  const out = new Uint8Array(parts.reduce((sum, p) => sum + p.length, 0));
  let offset = 0;
  for (const part of parts) { out.set(part, offset); offset += part.length; }
  return out;
}

/** Entries [{ name, data }] of a ZIP; throws ZipError (German message) if it is damaged or exceeds the limits. */
async function readZip(bytes, { maxEntries, maxTotalBytes }) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const end = findEnd(bytes, view);
  const count = view.getUint16(end + 10, true);
  if (view.getUint16(end + 4, true) !== 0 || view.getUint16(end + 8, true) !== count) {
    throw new ZipError("ZIP-Dateien über mehrere Teile gehen nicht.");
  }
  if (count > maxEntries) throw new ZipError(`Die Datei enthält zu viele Einträge (höchstens ${maxEntries}).`);
  const decoder = new TextDecoder("utf-8", { fatal: true });
  const entries = [];
  let total = 0;
  let position = view.getUint32(end + 16, true);
  for (let i = 0; i < count; i++) {
    const entry = centralEntry(bytes, view, position, decoder);
    position = entry.next;
    if (entry.name.endsWith("/")) continue;
    total += entry.size;
    if (total > maxTotalBytes) throw new ZipError(`Der Inhalt ist zu gross (höchstens ${Math.floor(maxTotalBytes / 1000000)} MB).`);
    entries.push({ name: entry.name, data: await entryData(bytes, view, entry) });
  }
  return entries;
}

function findEnd(bytes, view) {
  const lowest = Math.max(0, bytes.length - END_RECORD - MAX_COMMENT);
  for (let i = bytes.length - END_RECORD; i >= lowest; i--) {
    if (view.getUint32(i, true) === SIG_END) return i;
  }
  throw new ZipError("Die Datei ist keine ZIP-Datei.");
}

function centralEntry(bytes, view, at, decoder) {
  if (at + CENTRAL_HEADER > bytes.length || view.getUint32(at, true) !== SIG_CENTRAL) {
    throw new ZipError("Die Datei ist beschädigt (Inhaltsverzeichnis).");
  }
  const flags = view.getUint16(at + 8, true);
  if (flags & FLAG_ENCRYPTED) throw new ZipError("Verschlüsselte ZIP-Dateien gehen nicht.");
  const nameLength = view.getUint16(at + 28, true);
  const next = at + CENTRAL_HEADER + nameLength + view.getUint16(at + 30, true) + view.getUint16(at + 32, true);
  if (next > bytes.length) throw new ZipError("Die Datei ist beschädigt (Inhaltsverzeichnis).");
  let name;
  try {
    name = decoder.decode(bytes.subarray(at + CENTRAL_HEADER, at + CENTRAL_HEADER + nameLength));
  } catch (error) {
    throw new ZipError("Ein Dateiname in der ZIP-Datei ist ungültig.");
  }
  return {
    name, next, method: view.getUint16(at + 10, true), crc: view.getUint32(at + 16, true),
    compressed: view.getUint32(at + 20, true), size: view.getUint32(at + 24, true), offset: view.getUint32(at + 42, true),
  };
}

async function entryData(bytes, view, entry) {
  const at = entry.offset;
  if (at + LOCAL_HEADER > bytes.length || view.getUint32(at, true) !== SIG_LOCAL) {
    throw new ZipError("Die Datei ist beschädigt (Eintrag nicht gefunden).");
  }
  const start = at + LOCAL_HEADER + view.getUint16(at + 26, true) + view.getUint16(at + 28, true);
  if (start + entry.compressed > bytes.length) throw new ZipError("Die Datei ist beschädigt (Eintrag abgeschnitten).");
  const raw = bytes.subarray(start, start + entry.compressed);
  let data;
  if (entry.method === METHOD_STORED) data = raw.slice();
  else if (entry.method === METHOD_DEFLATE) {
    try {
      data = await streamThrough(raw, new DecompressionStream("deflate-raw"), entry.size);
    } catch (error) {
      if (error instanceof ZipError) throw error;
      throw new ZipError(`Die Datei ist beschädigt (${entry.name}).`);
    }
  } else throw new ZipError(`Diese Art der Komprimierung geht nicht (${entry.name}).`);
  if (data.length !== entry.size || crc32(data) !== entry.crc) throw new ZipError(`Die Datei ist beschädigt (${entry.name}).`);
  return data;
}

if (typeof module !== "undefined") {
  module.exports = { crc32, createZip, readZip, ZipError };
}

// Keeps uploaded documents in this browser (IndexedDB), so they are still there after closing the page.
// localStorage is too small for documents (about 5 MB). Everything stays on the device; "Alles löschen"
// removes it. Without IndexedDB (e.g. some private windows) the functions report failure and the page
// keeps the files in memory only.
"use strict";

const UPLOAD_DB_NAME = "bewerbungsassistent.einstieg";
const UPLOAD_DB_VERSION = 1;
const UPLOAD_DB_STORE = "uploads";
const UPLOAD_DB_KEY = "current";

function openUploadDb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB not available"));
      return;
    }
    const request = indexedDB.open(UPLOAD_DB_NAME, UPLOAD_DB_VERSION);
    request.onupgradeneeded = () => request.result.createObjectStore(UPLOAD_DB_STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("IndexedDB blocked"));
  });
}

/** Run one request in a transaction and resolve with its result once the transaction is done. */
async function withUploadStore(mode, makeRequest) {
  const db = await openUploadDb();
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction(UPLOAD_DB_STORE, mode);
      const request = makeRequest(transaction.objectStore(UPLOAD_DB_STORE));
      transaction.oncomplete = () => resolve(request.result);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error || new Error("IndexedDB aborted"));
    });
  } finally {
    db.close();
  }
}

/** Store the uploads ({ category, name, size, data }); true if they are kept in this browser. */
async function keepUploads(list) {
  try {
    const copy = list.map(({ category, name, size, data }) => ({ category, name, size, data }));
    await withUploadStore("readwrite", (store) => (copy.length ? store.put(copy, UPLOAD_DB_KEY) : store.delete(UPLOAD_DB_KEY)));
    return true;
  } catch (error) {
    return false;
  }
}

/** Uploads kept in this browser, or [] if there are none or they cannot be read. */
async function keptUploads() {
  try {
    const stored = await withUploadStore("readonly", (store) => store.get(UPLOAD_DB_KEY));
    return Array.isArray(stored) ? stored.filter(isKeptUpload) : [];
  } catch (error) {
    return [];
  }
}

function isKeptUpload(u) {
  return u !== null && typeof u === "object" && typeof u.category === "string" && typeof u.name === "string"

// Only in the page „Meine Angaben“ of the app: state and documents go to the data folder through the app,

"use strict";

const BASE64_CHUNK = 0x8000;

function toBase64(bytes) {
  let binary = "";
  for (let i = 0; i < bytes.length; i += BASE64_CHUNK) {
    binary += String.fromCharCode(...bytes.subarray(i, i + BASE64_CHUNK));
  }
  return btoa(binary);
}

function createAppBackend() {
  const token = document.querySelector('meta[name="token"]').content;

  async function answer(response) {
    const body = await response.json().catch(() => ({}));
    if (response.ok) return body;
    const error = new Error(body.fehler || "Die App antwortet nicht. Läuft sie noch?");
    error.status = response.status;
    error.existing = Boolean(body.vorhanden);
    error.choice = Array.isArray(body.wahl) ? body.wahl : []; // existing Markdown files to choose for (G26)
    throw error;
  }

  const post = (path, body) => fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json", "X-Token": token }, body: JSON.stringify(body),
  }).then(answer);

  return {
    overview: () => fetch(`/api/angaben/stand?${new URLSearchParams({ t: token })}`).then(answer),
    keep: (stand) => post("/api/angaben/stand", { stand }),
    discard: () => post("/api/angaben/stand-loeschen", {}),
    addDocument: (track, category, name, bytes) => post("/api/angaben/unterlage", { track, category, name, data: toBase64(bytes) }),
    removeDocument: (datei) => post("/api/angaben/unterlage-entfernen", { datei }),
    prefill: (track, data) => post("/api/angaben/vorbefuellen", { track, data }),
    takeOver: (bundle, ersetzen) => post("/api/angaben/uebernehmen", { bundle, ersetzen }),
  };
}

  if (run.problem) return el("p", { id: "prefill-status", className: "error", role: "alert" }, run.problem);

/**
 * The click on „Vorbefüllen“ (#156): the busy state shows and is brought into view before anything is awaited.
 * Uploads still on their way finish first, because the app reads only what has arrived; the page says so meanwhile.
 * steps: { show(run), reveal(), pendingUploads() → Promise or null, isCurrent() → boolean, ask() → Promise }
 * Resolves to the answer of ask(), or null when another run or other answers overtook this one.
 */
async function startPrefill(steps) {
  const pending = steps.pendingUploads();
  steps.show({ running: true, waiting: Boolean(pending), problem: null, report: null });
  steps.reveal();
  if (pending) {
    await pending.then(() => null, () => null); // a failed upload has its own message in the list
    if (!steps.isCurrent()) return null;
    steps.show({ running: true, waiting: false, problem: null, report: null });
    steps.reveal(); // the new files in the list may have pushed the text out of view
  }
  return steps.ask();
}

// Only in the page „Meine Angaben“ of the app: when the Markdown files exist already, taking over asks per file
// whether it is replaced (G26). Keeping is the default; a file chosen for replacing shows its differences first.
// The app computes them (onboarding/text_diff.py) as lines of the kinds gleich, weg, neu and luecke.
"use strict";

const KEEP = "keep";
const REPLACE = "replace";
const REPLACE_TEXT = {
  intro: "Pro Datei wählen, ob sie bleibt oder durch die neuen Angaben ersetzt wird. Der Lebenslauf (cv.yaml) nimmt die Angaben in jedem Fall auf.",
  keep: "Behalten",
  replace: "Ersetzen",
  diff: "Unterschiede zum bisherigen Stand: Zeilen mit − fallen weg, Zeilen mit + kommen dazu.",
  same: "Kein Unterschied zum bisherigen Stand.",
  gap: "…",
};
const DIFF_MARKS = { gleich: "  ", weg: "− ", neu: "+ " };

/** Every file starts as kept. */
function defaultReplaceChoices(changes) {
  return Object.fromEntries(changes.map((change) => [change.datei, KEEP]));
}

/** The files chosen for replacing, as the app expects them in `ersetzen`. */
function chosenReplacements(choices) {
  return Object.keys(choices).filter((file) => choices[file] === REPLACE);
}

/** One choice per file; onChoose(file, "keep" | "replace") hands each change back. Picking shows or hides the
 * differences in place, so the focus stays on the option. */
function replaceChoiceView({ changes, choices, onChoose }) {
  return el("div", { className: "replace-choice" }, [
    el("p", { className: "hint" }, REPLACE_TEXT.intro),
    ...changes.map((change, index) => fileChoiceView(change, choices[change.datei] || KEEP, index, onChoose)),
  ]);
}

function fileChoiceView(change, chosen, index, onChoose) {
  const name = `replace-choice-${index}`;
  const slot = el("div", { className: "replace-choice__diff", "aria-live": "polite" }, chosen === REPLACE ? diffView(change) : null);
  const pick = (value) => {
    slot.replaceChildren(...(value === REPLACE ? [diffView(change)] : []));
    onChoose(change.datei, value);
  };
  const option = (value) => el("label", { className: "option" }, [
    el("input", { type: "radio", name, value, checked: chosen === value, onchange: () => pick(value) }),
    ` ${REPLACE_TEXT[value]}`,
  ]);
  return el("fieldset", { className: "replace-choice__file" }, [
    el("legend", {}, `${change.titel} (${change.datei})`),
    el("div", { className: "choice", role: "radiogroup" }, [option(KEEP), option(REPLACE)]),
    slot,
  ]);
}

function diffView(change) {
  if (!change.zeilen.length) return el("p", { className: "hint" }, REPLACE_TEXT.same);
  return el("div", { className: "diff" }, [
    el("p", { className: "hint" }, REPLACE_TEXT.diff),
    el("pre", { className: "diff__lines" }, change.zeilen.map(diffLine)),
  ]);
}

function diffLine(line) {
  if (line.art === "luecke") return el("span", { className: "diff__line diff__line--gap" }, `${REPLACE_TEXT.gap}\n`);
  const tag = line.art === "weg" ? "del" : line.art === "neu" ? "ins" : "span";
  return el("span", { className: `diff__line diff__line--${line.art}` }, [
    DIFF_MARKS[line.art] || "  ",
    el(tag, {}, line.text),
    "\n",
  ]);
}
