<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<meta name="bewerbungsbegleiter" content="app">
<title>Suchbegriffe prüfen</title>
<link rel="stylesheet" href="/stil.css">
<link rel="stylesheet" href="/suchbegriffe.css">
</head>
<body>
<nav class="app-nav" aria-label="Hauptnavigation"><div class="app-nav__top"><a class="app-nav__brand" href="/">Bewerbungsbegleiter</a><span class="app-nav__budget-short" id="nav-budget-short" hidden></span><button type="button" class="app-nav__menu" id="nav-menu" aria-expanded="false" aria-controls="nav-more"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h12M3 9h12M3 13h12"></path></svg>Menü</button></div><ul class="app-nav__list"><li><a class="app-nav__link" href="/" data-target="heute"><span>Heute</span><span class="app-nav__count" id="badge-heute" hidden><span class="app-nav__count-long"></span><span class="app-nav__count-short"></span></span></a></li><li><a class="app-nav__link" href="/treffer" data-target="stellen"><span data-text="nav.stellen">Stellen</span><span class="app-nav__count" id="badge-stellen" hidden><span class="app-nav__count-long"></span><span class="app-nav__count-short"></span></span></a></li><li><a class="app-nav__link" href="/bewerbungen" data-target="bewerbungen">Bewerbungen</a></li><li class="app-nav__head">Meine Unterlagen</li><li><a class="app-nav__link" href="/angaben" data-target="angaben">Meine Angaben</a></li></ul><div class="app-nav__more" id="nav-more"><ul class="app-nav__list"><li><a class="app-nav__link" href="/dateien" data-target="dateien">Lebenslauf und Dateien</a></li><li class="app-nav__head">Hilfe</li><li><a class="app-nav__link" href="/fragen" data-target="fragen">Fragen an die KI</a></li><li><a class="app-nav__link" href="/einstellungen" data-target="einstellungen">Einstellungen</a></li></ul><div class="app-nav__status"><div class="app-nav__budget" id="nav-budget" hidden><span class="app-nav__budget-title" id="nav-budget-title"></span><div class="app-nav__bar" id="nav-budget-bar" role="img"><div class="app-nav__bar-fill" id="nav-budget-fill"></div></div><span class="num" id="nav-budget-text"></span><span class="num" id="nav-budget-detail"></span><strong class="app-nav__budget-warning" id="nav-budget-warning" hidden></strong></div><p class="app-nav__extension" id="nav-extension" hidden><span class="app-nav__dot" aria-hidden="true"></span><span id="nav-extension-text"></span> <a href="/einrichtung#erweiterung" id="nav-extension-setup" hidden>Einrichten</a></p></div></div></nav>
<main class="terms-page">
  <p><a href="/treffer">Zurück zu den Treffern</a></p>
  <header>
    <h1>Suchbegriffe prüfen</h1>
    <p class="terms-page__sub" id="gesehen"></p>
  </header>

  <div id="einwilligung" class="einwilligung" hidden></div>
  <div id="warten" class="progress" role="status" aria-live="polite" hidden>
    <div class="progress__head"><strong id="warten-titel"></strong></div>
    <div class="progress__busy" aria-hidden="true"></div>
    <p class="progress__note" id="warten-notiz"></p>
    <div><button type="button" class="btn btn--sm" id="abbrechen">Abbrechen</button></div>
  </div>
  <div id="meldung" class="notice" hidden><span class="notice__title" id="meldung-titel"></span><p class="notice__body" id="meldung-text"></p><div class="notice__actions" id="meldung-knoepfe"></div></div>

  <section id="vorschlag" class="ai-result" aria-labelledby="vorschlag-kopf" hidden>
    <div class="ai-result__head">
      <h2 id="vorschlag-kopf" tabindex="-1"></h2>
      <button type="button" class="btn btn--quiet btn--sm" id="frueher" hidden></button>
    </div>
    <p class="caption" id="runde" hidden></p>
    <p id="geaendert" hidden></p>
    <p class="caption" id="ihr-hinweis" hidden></p>
    <p id="zusammenfassung"></p>
    <fieldset id="aenderungen-feld">
      <legend class="visually-hidden">Änderungen zum Übernehmen</legend>
      <div id="aenderungen"></div>
    </fieldset>
    <details class="terms-outcome" id="endstand-block">
      <summary>So sucht die App danach</summary>
      <div id="endstand"></div>
      <p class="caption" id="faellt-weg"></p>
    </details>
    <p class="caption" id="grenzen"></p>
    <div class="btn-row">
      <button type="button" class="btn btn--primary" id="uebernehmen" aria-describedby="uebernehmen-grund"></button>
      <button type="button" class="btn" id="verwerfen">Verwerfen</button>
    </div>
    <p class="btn-reason" id="uebernehmen-grund"></p>
    <p class="status-line" id="status" role="status" aria-live="polite"></p>
    <p class="ai-result__foot"><span id="fuss-satz"></span> <span id="fuss"></span></p>
  </section>

  <section id="anders" class="terms-revise" aria-labelledby="anders-titel" hidden>
    <label class="field__label" id="anders-titel" for="anders-text">Was soll anders sein?</label>
    <textarea class="input" id="anders-text" rows="3" maxlength="1000" placeholder="Zum Beispiel: «Trainer» behalten, ich gebe auch Kurse für Erwachsene."></textarea>
    <p class="caption" id="anders-hilfe"></p>
    <div class="btn-row"><button type="button" class="btn" id="neu-vorschlagen">Neu vorschlagen</button> <span class="caption" id="anders-kosten"></span></div>
  </section>
</main>
<script src="/texte.js"></script>
<script src="/meldungen.js"></script>
<script src="/app.js"></script>
<script src="/uebersicht-logik.js"></script>
<script src="/sidebar-logic.js"></script>
<script src="/sidebar.js"></script>
<script src="/einwilligung.js"></script>
<script src="/suchbegriffe-logik.js"></script>
<script src="/suchbegriffe.js"></script>
</body>
</html>
