name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lebenslauf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lebenslauf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: pip install -r ../requirements-dev.txt
      - name: pdftotext für die Prüfung der Lesereihenfolge
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Tests
        run: python -m pytest -q
      - name: Beispiel-PDFs bauen
        run: |
          python build.py data/beispiel.yaml -o build/pdf/beispiel-zweispaltig.pdf
          python build.py data/beispiel.yaml --theme einspaltig -o build/pdf/beispiel-einspaltig.pdf
          python build.py data/beispiel.yaml --lang en -o build/pdf/beispiel-englisch.pdf
          python build.py data/beispiel.yaml --job jobs/beispiel-daten.yaml -o build/pdf/beispiel-daten.pdf
          python anschreiben.py data/anschreiben-beispiel.yaml -o build/pdf/anschreiben-beispiel.pdf
          python dossier.py data/dossier-beispiel.yaml --out-dir build/pdf/dossier-siegel
          python dossier.py data/dossier-beispiel.yaml --theme dossier-raster --out-dir build/pdf/dossier-raster
          python dossier.py data/dossier-beispiel.yaml --theme dossier-register --out-dir build/pdf/dossier-register
      - uses: actions/upload-artifact@v4
        with:
          name: beispiel-pdfs
          path: lebenslauf/build/pdf/

  bewerbungen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bewerbungen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: pip install -r ../requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests der Seiten
        run: node --test tests/*.test.cjs

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: pip install -r ../requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  vermittlung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vermittlung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: pip install -r ../requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  onboarding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten
        run: pip install -r ../requirements-dev.txt
      - name: Tests (Python)
        run: python -m pytest -q
      - name: Tests (JavaScript)
        run: node --test tests/*.test.cjs

  erweiterung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erweiterung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (JavaScript)
        run: node --test tests/*.test.mjs
      - name: Manifest lesbar
        run: node -e "const m = require('./manifest.json'); if (m.manifest_version !== 3 || !m.key) process.exit(1)"
