name: Lebenslauf

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lebenslauf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: pip install -r ../requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Beispiel-PDFs bauen
        run: |
          python build.py data/beispiel.yaml -o build/pdf/beispiel-zweispaltig.pdf
          python build.py data/beispiel.yaml --theme einspaltig -o build/pdf/beispiel-einspaltig.pdf
          python build.py data/beispiel.yaml --lang en -o build/pdf/beispiel-englisch.pdf
          python build.py data/beispiel.yaml --job jobs/beispiel-daten.yaml -o build/pdf/beispiel-daten.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: beispiel-pdfs
          path: lebenslauf/build/pdf/
