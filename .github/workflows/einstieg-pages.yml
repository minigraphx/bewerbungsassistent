name: Einstiegsvorlage veröffentlichen

# Veröffentlicht nur onboarding/dist/einstieg.html auf GitHub Pages.
# Vorerst nur von Hand starten; Pages muss dafür in den Einstellungen des Repos auf „GitHub Actions“ stehen.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vorlage aktuell?
        run: python onboarding/build_template.py --check
      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp onboarding/dist/einstieg.html site/einstieg.html
          cp onboarding/dist/einstieg.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
