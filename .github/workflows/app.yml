name: App-Paket

# Baut die lokale App für Windows (Installer) und macOS, testet sie und hängt sie bei einem Tag v* als
# Entwurf an ein Release. Erst das Veröffentlichen des Releases rollt das Update an alle aus (MIN-342):
# update-ausrollen.yml für den Update-Server, das Release selbst für Installationen bis 0.2.11 (MIN-403).
on:
  push:
    branches: [main]
    paths: ["desktop/**", "bewerbungen/**", "lebenslauf/**", "onboarding/**", "vorlagen/**", "erweiterung/**", "requirements.txt",
            ".github/workflows/app.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r desktop/requirements.txt
      - name: Version
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Tag passt nicht zu desktop/version.py ($version)" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Voreinstellungen (Adresse der KI-Vermittlung, kein Geheimnis)
        env:
          KI_URL: ${{ vars.KI_URL }}
          DATENSCHUTZ_URL: ${{ vars.DATENSCHUTZ_URL }}
          UPDATE_URL: ${{ vars.UPDATE_URL }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and -not $env:UPDATE_URL) { throw "Variable UPDATE_URL fehlt: Das Release bekäme nie mehr Updates" }
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          python -c "import json, os; json.dump({'ki_url': os.environ.get('KI_URL', ''), 'datenschutz_url': os.environ.get('DATENSCHUTZ_URL', ''), 'update_url': os.environ.get('UPDATE_URL', '')}, open('desktop/build/voreinstellungen.json', 'w'))"
      - name: Paket bauen
        run: pyinstaller --noconfirm desktop/bewerbungsbegleiter.spec
      - name: Selbsttest des Pakets
        run: |
          $p = Start-Process dist\Bewerbungsbegleiter\Bewerbungsbegleiter.exe -ArgumentList '--selbsttest' -Wait -PassThru
          Get-Content selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }
      - name: MCP des Pakets
        run: python desktop/mcp_smoke.py dist\Bewerbungsbegleiter\Bewerbungsbegleiter.exe
      - name: Installer bauen
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }
      - name: Über die alte Version mit dem alten Namen installieren (MIN-395)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.7 --pattern 'Bewerbungsassistent-Setup-*.exe' --dir alt
          if ($LASTEXITCODE -ne 0) { throw "Alte Version nicht geladen" }
          $alt = (Get-ChildItem alt\*.exe).FullName
          Start-Process $alt -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          $altOrdner = "$env:LOCALAPPDATA\Programs\Bewerbungsassistent"
          if (-not (Test-Path "$altOrdner\Bewerbungsassistent.exe")) { throw "Alte Version nicht installiert" }
          Start-Process "dist-installer\Bewerbungsbegleiter-Setup-$env:VERSION.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          if (Test-Path $altOrdner) { throw "Alter Ordner noch da" }
          if (Test-Path 'HKCU:\Software\Classes\bewerbungsassistent') { throw "Alter Link noch da" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Bewerbungsbegleiter\Bewerbungsbegleiter.exe")) { throw "Neue Version nicht installiert" }
      - name: Installieren, testen, deinstallieren
        run: |
          $setup = "dist-installer\Bewerbungsbegleiter-Setup-$env:VERSION.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Bewerbungsbegleiter"
          Remove-Item selbsttest.txt
          $p = Start-Process "$app\Bewerbungsbegleiter.exe" -ArgumentList '--selbsttest' -Wait -PassThru
          Get-Content selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest der Installation fehlgeschlagen" }
          if (-not (Test-Path 'HKCU:\Software\Classes\bewerbungsbegleiter\shell\open\command')) { throw "Link nicht angemeldet" }
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path 'HKCU:\Software\Classes\bewerbungsbegleiter') { throw "Link nach Deinstallation noch angemeldet" }
      - name: Prüfsummen
        run: |
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii dist-installer\SHA256SUMS.txt
          Get-Content dist-installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist-installer/
      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "v$env:VERSION" --draft --generate-notes --title "Bewerbungsbegleiter $env:VERSION" }
          gh release upload "v$env:VERSION" (Get-ChildItem dist-installer\*).FullName --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r desktop/requirements.txt
      - name: Voreinstellungen
        env:
          KI_URL: ${{ vars.KI_URL }}
          DATENSCHUTZ_URL: ${{ vars.DATENSCHUTZ_URL }}
          UPDATE_URL: ${{ vars.UPDATE_URL }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) [ -n "$UPDATE_URL" ] || { echo "::error::Variable UPDATE_URL fehlt: Das Release bekäme nie mehr Updates"; exit 1; };; esac
          mkdir -p desktop/build
          python -c "import json, os; json.dump({'ki_url': os.environ.get('KI_URL', ''), 'datenschutz_url': os.environ.get('DATENSCHUTZ_URL', ''), 'update_url': os.environ.get('UPDATE_URL', '')}, open('desktop/build/voreinstellungen.json', 'w'))"
      - name: Paket bauen und testen
        run: |
          pyinstaller --noconfirm desktop/bewerbungsbegleiter.spec
          dist/Bewerbungsbegleiter.app/Contents/MacOS/Bewerbungsbegleiter --selbsttest
          cat selbsttest.txt
          python desktop/mcp_smoke.py dist/Bewerbungsbegleiter.app/Contents/MacOS/Bewerbungsbegleiter
          VERSION=$(python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)")
          mkdir -p dist-mac
          ditto -c -k --keepParent dist/Bewerbungsbegleiter.app "dist-mac/Bewerbungsbegleiter-$VERSION-macOS.zip"
          (cd dist-mac && shasum -a 256 "Bewerbungsbegleiter-$VERSION-macOS.zip" > SHA256SUMS-macOS.txt)
          mkdir -p entpackt
          ditto -x -k "dist-mac/Bewerbungsbegleiter-$VERSION-macOS.zip" entpackt
          codesign --verify --deep --strict entpackt/Bewerbungsbegleiter.app
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist-mac/
      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --generate-notes --title "Bewerbungsbegleiter $VERSION"
          gh release upload "v$VERSION" dist-mac/* --clobber
