name: App-Paket

# Baut die lokale App für Windows (Installer), macOS und Linux (AppImage, #73), testet sie und hängt sie bei
# einem Tag v* als Entwurf an ein Release. Erst das Veröffentlichen des Releases rollt das Update an alle aus (MIN-342):
# update-ausrollen.yml für den Update-Server, das Release selbst für Installationen bis 0.2.11 (MIN-403).
on:
  push:
    branches: [main]
    paths: ["desktop/**", "bewerbungen/**", "lebenslauf/**", "onboarding/**", "vorlagen/**", "erweiterung/**", "requirements.txt",
            ".github/workflows/app.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r desktop/requirements.txt
      - name: Version
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Tag passt nicht zu desktop/version.py ($version)" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Voreinstellungen (Adresse der KI-Vermittlung, kein Geheimnis)
        env:
          KI_URL: ${{ vars.KI_URL }}
          DATENSCHUTZ_URL: ${{ vars.DATENSCHUTZ_URL }}
          UPDATE_URL: ${{ vars.UPDATE_URL }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and -not $env:UPDATE_URL) { throw "Variable UPDATE_URL fehlt: Das Release bekäme nie mehr Updates" }
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          python -c "import json, os; json.dump({'ki_url': os.environ.get('KI_URL', ''), 'datenschutz_url': os.environ.get('DATENSCHUTZ_URL', ''), 'update_url': os.environ.get('UPDATE_URL', '')}, open('desktop/build/voreinstellungen.json', 'w'))"
      - name: Paket bauen
        run: pyinstaller --noconfirm desktop/bewerbungsbegleiter.spec
      - name: PyInstaller-Ausgabe für das Store-Paket
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app
          path: dist/Bewerbungsbegleiter/
          include-hidden-files: true
          retention-days: 7
      - name: Selbsttest des Pakets
        run: |
          $p = Start-Process dist\Bewerbungsbegleiter\Bewerbungsbegleiter.exe -ArgumentList '--selbsttest' -Wait -PassThru
          Get-Content selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }
      - name: MCP des Pakets
        run: python desktop/mcp_smoke.py dist\Bewerbungsbegleiter\Bewerbungsbegleiter.exe
      - name: Installer bauen
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }
      - name: Über die alte Version mit dem alten Namen installieren (MIN-395)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.7 --pattern 'Bewerbungsassistent-Setup-*.exe' --dir alt
          if ($LASTEXITCODE -ne 0) { throw "Alte Version nicht geladen" }
          $alt = (Get-ChildItem alt\*.exe).FullName
          Start-Process $alt -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          $altOrdner = "$env:LOCALAPPDATA\Programs\Bewerbungsassistent"
          if (-not (Test-Path "$altOrdner\Bewerbungsassistent.exe")) { throw "Alte Version nicht installiert" }
          Start-Process "dist-installer\Bewerbungsbegleiter-Setup-$env:VERSION.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          if (Test-Path $altOrdner) { throw "Alter Ordner noch da" }
          if (Test-Path 'HKCU:\Software\Classes\bewerbungsassistent') { throw "Alter Link noch da" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Bewerbungsbegleiter\Bewerbungsbegleiter.exe")) { throw "Neue Version nicht installiert" }
      - name: Installieren, testen, deinstallieren
        run: |
          $setup = "dist-installer\Bewerbungsbegleiter-Setup-$env:VERSION.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Bewerbungsbegleiter"
          Remove-Item selbsttest.txt
          $p = Start-Process "$app\Bewerbungsbegleiter.exe" -ArgumentList '--selbsttest' -Wait -PassThru
          Get-Content selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest der Installation fehlgeschlagen" }
          if (-not (Test-Path 'HKCU:\Software\Classes\bewerbungsbegleiter\shell\open\command')) { throw "Link nicht angemeldet" }
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTART' -Wait
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path 'HKCU:\Software\Classes\bewerbungsbegleiter') { throw "Link nach Deinstallation noch angemeldet" }
      - name: Prüfsummen
        run: |
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii dist-installer\SHA256SUMS.txt
          Get-Content dist-installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist-installer/
      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "v$env:VERSION" --draft --generate-notes --title "Bewerbungsbegleiter $env:VERSION" }
          gh release upload "v$env:VERSION" (Get-ChildItem dist-installer\*).FullName --clobber

  msix:
    # Store-Paket (#343, G6) aus derselben PyInstaller-Ausgabe wie der Installer, mit der Variante, die #256 bewiesen
    # hat. Unsigniert: Der Store signiert es. Ein eigener Job, damit eine fehlende Variable nur ihn scheitern lässt.
    # Ohne die Variablen (auf main, von Hand) baut er mit der Platzhalter-Identität aus #255. Das Paket bleibt immer
    # nur Artefakt, auch auf einem Tag (#353): Unsigniert installiert es sich ausserhalb des Stores nicht.
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-app
          path: ${{ runner.temp }}/msix
      - name: Manifest (Identität aus den Variablen des Repos)
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)"
          $stage = Join-Path $env:RUNNER_TEMP 'msix'
          if (-not (Test-Path (Join-Path $stage 'Bewerbungsbegleiter.exe'))) { throw "PyInstaller-Ausgabe fehlt" }
          python desktop/msix/manifest.py desktop/msix/AppxManifest.xml $version store (Join-Path $stage 'AppxManifest.xml')
          if ($LASTEXITCODE -ne 0) { throw "Manifest nicht erstellt" }
          Get-Content (Join-Path $stage 'AppxManifest.xml')
          "VERSION=$version" >> $env:GITHUB_ENV
          "STAGE=$stage" >> $env:GITHUB_ENV
      - name: Logos
        run: |
          $assets = New-Item -ItemType Directory -Force (Join-Path $env:STAGE 'Assets')
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Image]::FromFile((Resolve-Path erweiterung\icons\icon128.png))
          foreach ($logo in @(@('StoreLogo', 50), @('Square44x44Logo', 44), @('Square150x150Logo', 150))) {
            $bitmap = New-Object System.Drawing.Bitmap $logo[1], $logo[1]
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = 'HighQualityBicubic'
            $graphics.DrawImage($icon, 0, 0, $logo[1], $logo[1])
            $bitmap.Save((Join-Path $assets "$($logo[0]).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          $icon.Dispose()
      - name: Packen
        run: |
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kit) { throw "makeappx nicht gefunden" }
          New-Item -ItemType Directory -Force dist-msix | Out-Null
          $package = "dist-msix\Bewerbungsbegleiter-$env:VERSION.msix"
          & "$($kit.FullName)" pack /o /d $env:STAGE /p $package
          if ($LASTEXITCODE -ne 0) { throw "makeappx fehlgeschlagen" }
          Get-Item $package | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix
          path: dist-msix/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r desktop/requirements.txt
      - name: Voreinstellungen
        env:
          KI_URL: ${{ vars.KI_URL }}
          DATENSCHUTZ_URL: ${{ vars.DATENSCHUTZ_URL }}
          UPDATE_URL: ${{ vars.UPDATE_URL }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) [ -n "$UPDATE_URL" ] || { echo "::error::Variable UPDATE_URL fehlt: Das Release bekäme nie mehr Updates"; exit 1; };; esac
          mkdir -p desktop/build
          python -c "import json, os; json.dump({'ki_url': os.environ.get('KI_URL', ''), 'datenschutz_url': os.environ.get('DATENSCHUTZ_URL', ''), 'update_url': os.environ.get('UPDATE_URL', '')}, open('desktop/build/voreinstellungen.json', 'w'))"
      - name: Paket bauen
        run: pyinstaller --noconfirm desktop/bewerbungsbegleiter.spec
      - name: Signieren
        # Immer dieselbe Identität statt ad hoc (#213, G48): So bleibt die Anforderung der Signatur gleich, und der
        # Schlüsselbund fragt nach einem Update nicht erneut. Die Identität macht desktop/signing_identity.py create.
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$MACOS_SIGNING_PASSWORD" ]; then
            echo "::error::Die Secrets MACOS_SIGNING_P12 und MACOS_SIGNING_PASSWORD fehlen. Ad hoc signiert fragte der Schlüsselbund nach jedem Update erneut; einmal 'python desktop/signing_identity.py create <Ordner ausserhalb des Repos>' ausführen und den Schritten folgen."
            exit 1
          fi
          requirement=$(python desktop/signing_identity.py requirement)
          p12="$RUNNER_TEMP/signatur.p12"
          keychain="$RUNNER_TEMP/signatur.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null; rm -f "$p12"' EXIT
          (umask 077; printf '%s' "$P12" | base64 --decode > "$p12")
          sha1=$(python desktop/signing_identity.py check "$p12")
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --keychain "$keychain" --sign "$sha1" dist/Bewerbungsbegleiter.app
          codesign --verify --deep --strict -R "=$requirement" dist/Bewerbungsbegleiter.app
      - name: Paket testen
        run: |
          dist/Bewerbungsbegleiter.app/Contents/MacOS/Bewerbungsbegleiter --selbsttest
          cat selbsttest.txt
          python desktop/mcp_smoke.py dist/Bewerbungsbegleiter.app/Contents/MacOS/Bewerbungsbegleiter
          VERSION=$(python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)")
          mkdir -p dist-mac
          ditto -c -k --keepParent dist/Bewerbungsbegleiter.app "dist-mac/Bewerbungsbegleiter-$VERSION-macOS.zip"
          (cd dist-mac && shasum -a 256 "Bewerbungsbegleiter-$VERSION-macOS.zip" > SHA256SUMS-macOS.txt)
          mkdir -p entpackt
          ditto -x -k "dist-mac/Bewerbungsbegleiter-$VERSION-macOS.zip" entpackt
          codesign --verify --deep --strict -R "=$(python desktop/signing_identity.py requirement)" entpackt/Bewerbungsbegleiter.app
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist-mac/
      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --generate-notes --title "Bewerbungsbegleiter $VERSION"
          gh release upload "v$VERSION" dist-mac/* --clobber

  linux:
    # Ubuntu 22.04: Was dort gebaut ist, läuft auch auf neueren Systemen (glibc), so auf dem aktuellen LTS und Mint.
    runs-on: ubuntu-22.04
    env:
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Systempakete (FUSE für das AppImage, xdg-utils für den Einladungslink)
        run: sudo apt-get update -q && sudo apt-get install -y -q fuse3 xdg-utils desktop-file-utils
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r desktop/requirements.txt
      - name: Version und Voreinstellungen
        env:
          KI_URL: ${{ vars.KI_URL }}
          DATENSCHUTZ_URL: ${{ vars.DATENSCHUTZ_URL }}
          UPDATE_URL: ${{ vars.UPDATE_URL }}
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)")
          case "$GITHUB_REF" in refs/tags/v*)
            [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::Tag passt nicht zu desktop/version.py ($VERSION)"; exit 1; }
            [ -n "$UPDATE_URL" ] || { echo "::error::Variable UPDATE_URL fehlt: Das Release bekäme nie mehr Updates"; exit 1; };; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p desktop/build
          python -c "import json, os; json.dump({'ki_url': os.environ.get('KI_URL', ''), 'datenschutz_url': os.environ.get('DATENSCHUTZ_URL', ''), 'update_url': os.environ.get('UPDATE_URL', '')}, open('desktop/build/voreinstellungen.json', 'w'))"
      - name: Paket bauen und testen
        run: |
          pyinstaller --noconfirm desktop/bewerbungsbegleiter.spec
          dist/Bewerbungsbegleiter/Bewerbungsbegleiter --selbsttest
          cat selbsttest.txt
          python desktop/mcp_smoke.py dist/Bewerbungsbegleiter/Bewerbungsbegleiter
      - name: AppImage bauen (Werkzeuge mit Prüfsumme)
        run: |
          mkdir -p werkzeug
          curl -fsSL -o werkzeug/appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o werkzeug/runtime "$RUNTIME_URL"
          printf '%s  werkzeug/appimagetool\n%s  werkzeug/runtime\n' "$APPIMAGETOOL_SHA256" "$RUNTIME_SHA256" | sha256sum -c -
          chmod +x werkzeug/appimagetool
          python desktop/appimage.py dist/Bewerbungsbegleiter "dist-linux/Bewerbungsbegleiter-$VERSION-x86_64.AppImage" \
            --tool werkzeug/appimagetool --runtime werkzeug/runtime
          rm -rf dist-linux/AppDir
      - name: AppImage testen
        run: |
          # setup-python setzt LD_LIBRARY_PATH auf seine Bibliotheken; ein frisches Ubuntu hat das nicht.
          IMAGE="dist-linux/Bewerbungsbegleiter-$VERSION-x86_64.AppImage"
          rm -f selbsttest.txt
          env -u LD_LIBRARY_PATH "$IMAGE" --selbsttest
          cat selbsttest.txt
          rm -f selbsttest.txt
          env -u LD_LIBRARY_PATH "$IMAGE" --appimage-extract-and-run --selbsttest  # ohne FUSE, der Ausweg aus desktop/README.md
          cat selbsttest.txt
          python desktop/linux_smoke.py "$IMAGE"
          (cd dist-linux && sha256sum "Bewerbungsbegleiter-$VERSION-x86_64.AppImage" > SHA256SUMS-Linux.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist-linux/
      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --generate-notes --title "Bewerbungsbegleiter $VERSION"
          gh release upload "v$VERSION" dist-linux/* --clobber

  erweiterung:
    # The extension as a direct download for Chrome and Edge (#403, G126). Unlike the store ZIP it keeps `key`, so an
    # unpacked copy gets the ID the app allows. update-ausrollen.yml puts it on the update server and announces it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: ZIP bauen
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.VERSION)")
          case "$GITHUB_REF" in refs/tags/v*)
            [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::Tag passt nicht zu desktop/version.py ($VERSION)"; exit 1; };; esac
          python desktop/extension_download.py dist-erweiterung
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erweiterung
          path: dist-erweiterung/
      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --generate-notes --title "Bewerbungsbegleiter $VERSION"
          gh release upload "v$VERSION" dist-erweiterung/* --clobber
